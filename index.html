<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>XTRADE</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            touch-action: none;
        }
        
        /* ===== LAYOUT ===== */
        .app-container {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000000;
        }
        
        /* ===== HEADER/BALANCE ===== */
        .header-section {
            padding: 20px 20px 25px;
            background: #0a0a0a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
        
        .balance-display {
            text-align: center;
            margin-bottom: 8px;
        }
        
        .balance-amount {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 4px;
        }
        
        .balance-change {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .change-positive {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }
        
        .change-negative {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
        }
        
        .balance-label {
            font-size: 13px;
            color: #888888;
            letter-spacing: 0.3px;
        }
        
        /* ===== CHART ===== */
        .chart-section {
            flex: 1;
            min-height: 0;
            position: relative;
            padding: 15px;
        }
        
        .chart-wrapper {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        
        #chartCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .chart-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        
        .chart-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* ===== CONTROLS ===== */
        .controls-section {
            padding: 20px;
            background: #0a0a0a;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
        
        /* Trade Buttons */
        .trade-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .trade-btn {
            flex: 1;
            height: 64px;
            border: none;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }
        
        .trade-btn:active {
            transform: scale(0.97);
        }
        
        .trade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .long-btn {
            background: linear-gradient(135deg, #00cc6a 0%, #00ff88 100%);
            color: #000000;
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.25);
        }
        
        .short-btn {
            background: linear-gradient(135deg, #cc3636 0%, #ff4444 100%);
            color: #000000;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.25);
        }
        
        /* Sliders */
        .slider-group {
            margin-bottom: 20px;
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .slider-label {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }
        
        .slider-value {
            font-size: 18px;
            font-weight: 700;
        }
        
        .slider-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .slider-fill {
            height: 100%;
            border-radius: 4px;
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.2s ease;
        }
        
        .leverage-fill {
            background: linear-gradient(to right, #006633, #00ff88);
        }
        
        .bet-fill {
            background: linear-gradient(to right, #003366, #00a3ff);
        }
        
        input[type="range"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }
        
        .slider-ticks {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }
        
        .tick {
            font-size: 10px;
            color: #666666;
            font-weight: 500;
        }
        
        /* Info */
        .trade-info {
            font-size: 13px;
            color: #888888;
            text-align: center;
            line-height: 1.4;
            margin-top: 15px;
        }
        
        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 20px;
            background: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label {
            color: #888888;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }
        
        /* ===== MENU ===== */
        .menu-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            z-index: 50;
        }
        
        .menu-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #ffffff;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .menu-overlay.active {
            display: flex;
        }
        
        .menu-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #ffffff;
            cursor: pointer;
        }
        
        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 260px;
        }
        
        .menu-item {
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .menu-item:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.98);
        }
        
        /* ===== GAME OVER ===== */
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over h2 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ff4444 0%, #ff0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .game-over p {
            font-size: 16px;
            color: #888888;
            margin-bottom: 30px;
            text-align: center;
            max-width: 280px;
        }
        
        .restart-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #00cc6a 0%, #00ff88 100%);
            border: none;
            border-radius: 16px;
            color: #000000;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .restart-btn:active {
            transform: scale(0.97);
        }
        
        /* ===== STATUS MESSAGE ===== */
        .status-message {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            padding: 14px 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 40;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        
        .status-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* ===== ANIMATIONS ===== */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-height: 700px) {
            .balance-amount {
                font-size: 42px;
            }
            
            .trade-btn {
                height: 58px;
                font-size: 20px;
            }
            
            .chart-section {
                padding: 12px;
            }
            
            .controls-section {
                padding: 16px;
            }
        }
        
        @media (max-width: 350px) {
            .balance-amount {
                font-size: 40px;
            }
            
            .trade-btn {
                height: 56px;
                font-size: 19px;
            }
            
            .slider-value {
                font-size: 16px;
            }
        }
        
        /* ===== PERFORMANCE OPTIMIZATIONS ===== */
        .app-container * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Prevent text selection */
        .app-container {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Optimize canvas rendering */
        #chartCanvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <!-- Menu -->
    <div class="menu-button" id="menuButton">
        <div class="menu-dot"></div>
        <div class="menu-dot"></div>
        <div class="menu-dot"></div>
    </div>
    
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-close" id="menuClose">✕</div>
        <div class="menu-items">
            <div class="menu-item" id="accountBtn">Account</div>
            <div class="menu-item" id="rankBtn">Ranking</div>
            <div class="menu-item" id="settingsBtn">Settings</div>
            <div class="menu-item" id="infoBtn">Info</div>
        </div>
    </div>
    
    <!-- Game Over -->
    <div class="game-over" id="gameOverScreen">
        <h2>BANKRUPTCY</h2>
        <p>Balance reached zero</p>
        <button class="restart-btn" id="restartBtn">TRY AGAIN</button>
    </div>
    
    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>
    
    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <div class="header-section">
            <div class="balance-display">
                <div class="balance-amount" id="balanceAmount">$10,000.00</div>
                <div class="balance-change change-positive" id="balanceChange">
                    <span id="changeIcon">↑</span>
                    <span id="changeAmount">+$300.00</span>
                    <span id="changePercent">3.00%</span>
                </div>
                <div class="balance-label">TOTAL BALANCE</div>
            </div>
        </div>
        
        <!-- Chart -->
        <div class="chart-section">
            <div class="chart-wrapper">
                <canvas id="chartCanvas"></canvas>
                <div class="chart-overlay">
                    <div class="chart-badge" id="chartStatus">LIVE</div>
                    <div class="chart-badge" id="winProbability">85% WIN</div>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls-section">
            <div class="trade-buttons">
                <button class="trade-btn long-btn" id="longBtn">LONG</button>
                <button class="trade-btn short-btn" id="shortBtn">SHORT</button>
            </div>
            
            <div class="slider-group">
                <div class="slider-header">
                    <div class="slider-label">LEVERAGE</div>
                    <div class="slider-value" id="leverageValue" style="color: #00ff88">1x</div>
                </div>
                <div class="slider-track">
                    <div class="slider-fill leverage-fill" id="leverageFill" style="width: 0%"></div>
                    <input type="range" min="0" max="7" value="0" id="leverageSlider">
                </div>
                <div class="slider-ticks">
                    <div class="tick">1x</div>
                    <div class="tick">2x</div>
                    <div class="tick">3x</div>
                    <div class="tick">5x</div>
                    <div class="tick">10x</div>
                    <div class="tick">20x</div>
                    <div class="tick">50x</div>
                    <div class="tick">100x</div>
                </div>
            </div>
            
            <div class="slider-group">
                <div class="slider-header">
                    <div class="slider-label">BET AMOUNT</div>
                    <div class="slider-value" id="betPercentageValue" style="color: #00a3ff">5%</div>
                </div>
                <div class="slider-track">
                    <div class="slider-fill bet-fill" id="betFill" style="width: 5%"></div>
                    <input type="range" min="1" max="100" value="5" id="betSlider">
                </div>
                <div class="slider-ticks">
                    <div class="tick">1%</div>
                    <div class="tick">25%</div>
                    <div class="tick">50%</div>
                    <div class="tick">75%</div>
                    <div class="tick">100%</div>
                </div>
            </div>
            
            <div class="trade-info" id="tradeInfo">
                Bet: $500.00 | Win: $500.00 | Loss: $500.00
            </div>
        </div>
        
        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">BEST</div>
                <div class="stat-value" id="bestBalance">$12,450</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">TRADES</div>
                <div class="stat-value" id="totalTrades">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">WIN RATE</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const CONFIG = {
            LEVERAGES: [
                { value: 1, baseWin: 0.85, color: "#00ff88", name: "Novice" },
                { value: 2, baseWin: 0.75, color: "#66ffaa", name: "Beginner" },
                { value: 3, baseWin: 0.65, color: "#99ffcc", name: "Intermediate" },
                { value: 5, baseWin: 0.55, color: "#ffff44", name: "Expert" },
                { value: 10, baseWin: 0.45, color: "#ffaa44", name: "Risky" },
                { value: 20, baseWin: 0.35, color: "#ff7744", name: "High Risk" },
                { value: 50, baseWin: 0.25, color: "#ff4444", name: "Extreme" },
                { value: 100, baseWin: 0.15, color: "#ff2244", name: "Insane" }
            ],
            UNLOCKS: [
                { threshold: 1000, maxIndex: 0 },
                { threshold: 1500, maxIndex: 1 },
                { threshold: 2500, maxIndex: 2 },
                { threshold: 5000, maxIndex: 3 },
                { threshold: 10000, maxIndex: 4 },
                { threshold: 25000, maxIndex: 5 },
                { threshold: 50000, maxIndex: 6 },
                { threshold: 100000, maxIndex: 7 }
            ],
            INITIAL_BALANCE: 10000,
            MIN_BALANCE: 1000,
            MAX_BET: 100,
            MIN_BET: 1
        };

        // ==================== STATE ====================
        let state = {
            balance: CONFIG.INITIAL_BALANCE,
            bestBalance: CONFIG.INITIAL_BALANCE,
            totalTrades: 0,
            wins: 0,
            currentTrade: null,
            gameActive: true,
            isAnimating: false,
            chartData: [],
            chartStep: 0,
            decisionPoint: 0,
            userChoice: null,
            tradeResult: null,
            
            leverageIndex: 0,
            betPercentage: 5,
            
            lastBalance: CONFIG.INITIAL_BALANCE
        };

        // ==================== DOM REFERENCES ====================
        const dom = {
            // Balance
            balanceAmount: document.getElementById('balanceAmount'),
            balanceChange: document.getElementById('balanceChange'),
            changeIcon: document.getElementById('changeIcon'),
            changeAmount: document.getElementById('changeAmount'),
            changePercent: document.getElementById('changePercent'),
            
            // Chart
            chartCanvas: document.getElementById('chartCanvas'),
            chartCtx: null,
            chartStatus: document.getElementById('chartStatus'),
            winProbability: document.getElementById('winProbability'),
            
            // Controls
            longBtn: document.getElementById('longBtn'),
            shortBtn: document.getElementById('shortBtn'),
            leverageSlider: document.getElementById('leverageSlider'),
            leverageValue: document.getElementById('leverageValue'),
            leverageFill: document.getElementById('leverageFill'),
            betSlider: document.getElementById('betSlider'),
            betPercentageValue: document.getElementById('betPercentageValue'),
            betFill: document.getElementById('betFill'),
            tradeInfo: document.getElementById('tradeInfo'),
            
            // Stats
            bestBalanceElement: document.getElementById('bestBalance'),
            totalTradesElement: document.getElementById('totalTrades'),
            winRateElement: document.getElementById('winRate'),
            
            // UI
            statusMessage: document.getElementById('statusMessage'),
            gameOverScreen: document.getElementById('gameOverScreen'),
            restartBtn: document.getElementById('restartBtn'),
            menuButton: document.getElementById('menuButton'),
            menuOverlay: document.getElementById('menuOverlay'),
            menuClose: document.getElementById('menuClose'),
            appContainer: document.getElementById('appContainer')
        };

        // ==================== UTILITY FUNCTIONS ====================
        function formatCurrency(amount) {
            return '$' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function calculateWinProbability() {
            const leverage = CONFIG.LEVERAGES[state.leverageIndex];
            const penalty = state.betPercentage / 200;
            const probability = leverage.baseWin * (1 - penalty);
            return Math.max(0.05, Math.min(0.95, probability));
        }

        function getMaxLeverageIndex() {
            for (let i = CONFIG.UNLOCKS.length - 1; i >= 0; i--) {
                if (state.balance >= CONFIG.UNLOCKS[i].threshold) {
                    return CONFIG.UNLOCKS[i].maxIndex;
                }
            }
            return 0;
        }

        function calculateBetAmount() {
            return state.balance * (state.betPercentage / 100);
        }

        // ==================== CORE GAME FUNCTIONS ====================
        function initGame() {
            setupCanvas();
            loadGameState();
            setupEventListeners();
            updateUI();
            startNewRound();
        }

        function setupCanvas() {
            const canvas = dom.chartCanvas;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            dom.chartCtx = canvas.getContext('2d');
            dom.chartCtx.scale(dpr, dpr);
            
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
        }

        function setupEventListeners() {
            // Game controls
            dom.longBtn.addEventListener('click', handleLong);
            dom.shortBtn.addEventListener('click', handleShort);
            dom.leverageSlider.addEventListener('input', handleLeverageChange);
            dom.betSlider.addEventListener('input', handleBetChange);
            dom.restartBtn.addEventListener('click', handleRestart);
            
            // Menu
            dom.menuButton.addEventListener('click', openMenu);
            dom.menuClose.addEventListener('click', closeMenu);
            
            // Prevent zoom/scroll
            document.addEventListener('touchmove', (e) => {
                if (e.scale !== 1) e.preventDefault();
            }, { passive: false });
            
            // Resize handling
            window.addEventListener('resize', () => {
                setupCanvas();
                if (state.chartData.length > 0) {
                    drawChart();
                }
            });
        }

        // ==================== TRADE LOGIC ====================
        function handleLong() {
            if (!state.gameActive || state.isAnimating || state.userChoice) return;
            
            state.userChoice = 'long';
            state.tradeResult = Math.random() < calculateWinProbability();
            executeTrade();
        }

        function handleShort() {
            if (!state.gameActive || state.isAnimating || state.userChoice) return;
            
            state.userChoice = 'short';
            state.tradeResult = Math.random() < calculateWinProbability();
            executeTrade();
        }

        function executeTrade() {
            dom.longBtn.disabled = true;
            dom.shortBtn.disabled = true;
            dom.chartStatus.textContent = state.tradeResult ? 'WINNING' : 'LOSING';
            
            // Modify chart trend based on result
            const trend = (state.userChoice === 'long' ? 1 : -1) * (state.tradeResult ? 0.08 : -0.08);
            modifyChartTrend(trend);
            
            state.isAnimating = true;
            animateChart();
        }

        function modifyChartTrend(trend) {
            const startValue = state.chartData[state.decisionPoint];
            for (let i = state.decisionPoint + 1; i < state.chartData.length; i++) {
                const progress = (i - state.decisionPoint) / (state.chartData.length - state.decisionPoint);
                state.chartData[i] = startValue + trend * progress * 30 + (Math.random() - 0.5) * 2;
                state.chartData[i] = Math.max(20, Math.min(80, state.chartData[i]));
            }
        }

        function completeTrade() {
            const betAmount = calculateBetAmount();
            const leverage = CONFIG.LEVERAGES[state.leverageIndex].value;
            const result = state.tradeResult ? betAmount * leverage : -betAmount * leverage;
            
            state.balance += result;
            state.totalTrades++;
            
            if (state.tradeResult) {
                state.wins++;
                showStatus(`WIN! +${formatCurrency(betAmount * leverage)}`, '#00ff88');
            } else {
                showStatus(`LOSS! -${formatCurrency(betAmount * leverage)}`, '#ff4444');
            }
            
            // Update best balance
            if (state.balance > state.bestBalance) {
                state.bestBalance = state.balance;
            }
            
            // Check for bankruptcy
            if (state.balance <= 0) {
                state.gameActive = false;
                dom.gameOverScreen.style.display = 'flex';
            }
            
            updateUI();
            saveGameState();
            
            // Reset for next round
            setTimeout(() => {
                state.userChoice = null;
                state.tradeResult = null;
                startNewRound();
            }, 2000);
        }

        // ==================== CHART FUNCTIONS ====================
        function generateChartData() {
            const data = [];
            let value = 50;
            
            for (let i = 0; i < 150; i++) {
                value += (Math.random() - 0.5) * 3;
                value = Math.max(20, Math.min(80, value));
                data.push(value);
            }
            
            return data;
        }

        function drawChart() {
            const ctx = dom.chartCtx;
            const width = dom.chartCanvas.width / (window.devicePixelRatio || 1);
            const height = dom.chartCanvas.height / (window.devicePixelRatio || 1);
            
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            if (state.chartData.length === 0) return;
            
            // Setup
            const data = state.chartData;
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min || 1;
            
            const xScale = width / (data.length - 1);
            const yScale = height / range;
            
            // Draw line
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Determine color
            let color = '#ffffff';
            if (state.tradeResult === true) color = '#00ff88';
            if (state.tradeResult === false) color = '#ff4444';
            
            ctx.strokeStyle = color;
            
            // Draw up to current step
            const steps = Math.min(state.chartStep, data.length);
            for (let i = 0; i < steps; i++) {
                const x = i * xScale;
                const y = height - ((data[i] - min) * yScale);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            
            // Draw decision point marker
            if (state.userChoice && state.chartStep > state.decisionPoint) {
                const x = state.decisionPoint * xScale;
                const y = height - ((data[state.decisionPoint] - min) * yScale);
                
                ctx.beginPath();
                ctx.fillStyle = color;
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateChart() {
            if (state.chartStep < state.chartData.length) {
                state.chartStep++;
                drawChart();
                
                if (state.chartStep === state.decisionPoint + 1 && !state.userChoice) {
                    state.isAnimating = false;
                    dom.longBtn.disabled = false;
                    dom.shortBtn.disabled = false;
                    dom.chartStatus.textContent = 'DECIDE';
                    dom.chartStatus.classList.add('pulse');
                }
                
                if (state.isAnimating || state.userChoice) {
                    requestAnimationFrame(() => {
                        setTimeout(animateChart, 16);
                    });
                }
            } else {
                completeTrade();
            }
        }

        function startNewRound() {
            state.chartData = generateChartData();
            state.chartStep = 0;
            state.userChoice = null;
            state.tradeResult = null;
            state.decisionPoint = Math.floor(state.chartData.length * 0.6);
            state.isAnimating = true;
            
            dom.chartStatus.textContent = 'LIVE';
            dom.chartStatus.classList.remove('pulse');
            dom.longBtn.disabled = true;
            dom.shortBtn.disabled = true;
            
            animateChart();
        }

        // ==================== UI UPDATES ====================
        function updateUI() {
            // Update balance
            dom.balanceAmount.textContent = formatCurrency(state.balance);
            dom.bestBalanceElement.textContent = '$' + Math.round(state.bestBalance).toLocaleString();
            
            // Update change indicator
            updateChangeIndicator();
            
            // Update stats
            dom.totalTradesElement.textContent = state.totalTrades;
            const winRate = state.totalTrades > 0 ? Math.round((state.wins / state.totalTrades) * 100) : 0;
            dom.winRateElement.textContent = winRate + '%';
            
            // Update controls
            updateControls();
            
            // Update trade info
            updateTradeInfo();
        }

        function updateChangeIndicator() {
            const change = state.balance - state.lastBalance;
            const percentChange = (change / state.lastBalance) * 100;
            
            if (change > 0) {
                dom.balanceChange.className = 'balance-change change-positive';
                dom.changeIcon.textContent = '↑';
                dom.changeAmount.textContent = `+${formatCurrency(Math.abs(change))}`;
                dom.changePercent.textContent = `${Math.abs(percentChange).toFixed(2)}%`;
            } else if (change < 0) {
                dom.balanceChange.className = 'balance-change change-negative';
                dom.changeIcon.textContent = '↓';
                dom.changeAmount.textContent = `-${formatCurrency(Math.abs(change))}`;
                dom.changePercent.textContent = `${Math.abs(percentChange).toFixed(2)}%`;
            }
            
            // Store for next comparison
            state.lastBalance = state.balance;
        }

        function updateControls() {
            const maxLeverageIndex = getMaxLeverageIndex();
            dom.leverageSlider.max = maxLeverageIndex;
            
            // Cap current leverage if too high
            if (state.leverageIndex > maxLeverageIndex) {
                state.leverageIndex = maxLeverageIndex;
                dom.leverageSlider.value = state.leverageIndex;
            }
            
            const leverage = CONFIG.LEVERAGES[state.leverageIndex];
            dom.leverageValue.textContent = `${leverage.value}x`;
            dom.leverageValue.style.color = leverage.color;
            dom.leverageFill.style.width = `${(state.leverageIndex / 7) * 100}%`;
            
            dom.betPercentageValue.textContent = `${state.betPercentage}%`;
            dom.betFill.style.width = `${state.betPercentage}%`;
            
            // Update win probability
            const winProb = Math.round(calculateWinProbability() * 100);
            dom.winProbability.textContent = `${winProb}% WIN`;
            dom.winProbability.style.color = winProb > 50 ? '#00ff88' : 
                                           winProb > 30 ? '#ffaa44' : '#ff4444';
        }

        function updateTradeInfo() {
            const betAmount = calculateBetAmount();
            const leverage = CONFIG.LEVERAGES[state.leverageIndex].value;
            const winProb = Math.round(calculateWinProbability() * 100);
            
            dom.tradeInfo.innerHTML = `
                Bet: <strong>${formatCurrency(betAmount)}</strong> | 
                Leverage: <strong>${leverage}x</strong> | 
                Win Chance: <strong>${winProb}%</strong>
            `;
        }

        function showStatus(message, color) {
            dom.statusMessage.textContent = message;
            dom.statusMessage.style.color = color;
            dom.statusMessage.classList.add('show');
            
            setTimeout(() => {
                dom.statusMessage.classList.remove('show');
            }, 3000);
        }

        // ==================== EVENT HANDLERS ====================
        function handleLeverageChange() {
            state.leverageIndex = parseInt(dom.leverageSlider.value);
            updateUI();
            saveGameState();
        }

        function handleBetChange() {
            state.betPercentage = parseInt(dom.betSlider.value);
            updateUI();
            saveGameState();
        }

        function handleRestart() {
            state.balance = CONFIG.MIN_BALANCE;
            state.gameActive = true;
            state.leverageIndex = 0;
            state.betPercentage = 5;
            
            dom.leverageSlider.value = state.leverageIndex;
            dom.betSlider.value = state.betPercentage;
            dom.gameOverScreen.style.display = 'none';
            
            updateUI();
            saveGameState();
            startNewRound();
        }

        function openMenu() {
            dom.menuOverlay.classList.add('active');
            state.isAnimating = false;
        }

        function closeMenu() {
            dom.menuOverlay.classList.remove('active');
            if (state.gameActive && !state.userChoice) {
                state.isAnimating = true;
                animateChart();
            }
        }

        // ==================== DATA PERSISTENCE ====================
        function saveGameState() {
            localStorage.setItem('xtrade_balance', state.balance.toString());
            localStorage.setItem('xtrade_best', state.bestBalance.toString());
            localStorage.setItem('xtrade_trades', state.totalTrades.toString());
            localStorage.setItem('xtrade_wins', state.wins.toString());
            localStorage.setItem('xtrade_leverage', state.leverageIndex.toString());
            localStorage.setItem('xtrade_bet', state.betPercentage.toString());
        }

        function loadGameState() {
            const savedBalance = localStorage.getItem('xtrade_balance');
            const savedBest = localStorage.getItem('xtrade_best');
            const savedTrades = localStorage.getItem('xtrade_trades');
            const savedWins = localStorage.getItem('xtrade_wins');
            const savedLeverage = localStorage.getItem('xtrade_leverage');
            const savedBet = localStorage.getItem('xtrade_bet');
            
            if (savedBalance) state.balance = parseFloat(savedBalance);
            if (savedBest) state.bestBalance = parseFloat(savedBest);
            if (savedTrades) state.totalTrades = parseInt(savedTrades);
            if (savedWins) state.wins = parseInt(savedWins);
            if (savedLeverage) state.leverageIndex = parseInt(savedLeverage);
            if (savedBet) state.betPercentage = parseInt(savedBet);
            
            // Validate
            state.balance = Math.max(CONFIG.MIN_BALANCE, state.balance);
            state.bestBalance = Math.max(state.bestBalance, CONFIG.MIN_BALANCE);
            state.leverageIndex = Math.max(0, Math.min(7, state.leverageIndex));
            state.betPercentage = Math.max(1, Math.min(100, state.betPercentage));
            
            state.lastBalance = state.balance;
            
            // Update sliders
            dom.leverageSlider.value = state.leverageIndex;
            dom.betSlider.value = state.betPercentage;
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
