<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>XTRADE PRO - Real Bitcoin Trading</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            touch-action: none;
        }
        
        /* Prevent selection */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ff88, #00a3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .login-subtitle {
            font-size: 14px;
            color: #888888;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .password-input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 3px;
        }
        
        .password-input:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00cc6a 0%, #00ff88 100%);
            border: none;
            border-radius: 12px;
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }
        
        .login-btn:active {
            transform: scale(0.97);
        }
        
        .login-warning {
            font-size: 12px;
            color: #ff4444;
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
        }
        
        .login-error {
            font-size: 13px;
            color: #ff4444;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }
        
        /* Nascondi login screen quando loggato */
        .login-screen.hidden {
            display: none;
        }
        
        /* Tutti gli stili originali qui... */
        /* (MANTENI TUTTI GLI STILI ORIGINALI DEL PRIMO CODICE) */
        /* ...tutti gli stili CSS rimangono uguali... */
        
        /* Aggiungi al fondo del CSS */
        .api-status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid;
            z-index: 100;
        }
        
        .api-status.connected {
            color: #00ff88;
            border-color: #00ff88;
        }
        
        .api-status.disconnected {
            color: #ff4444;
            border-color: #ff4444;
        }
        
        .api-status.connecting {
            color: #ffaa44;
            border-color: #ffaa44;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1 class="login-title">XTRADE PRO</h1>
            <div class="login-subtitle">Real Bitcoin Trading Platform</div>
            
            <input type="password" class="password-input" id="passwordInput" placeholder="Enter Access Password" autocomplete="off">
            
            <button class="login-btn" id="loginBtn">UNLOCK TRADING</button>
            
            <div class="login-error" id="loginError"></div>
            
            <div class="login-warning">
                ⚠️ WARNING: This is a real trading interface.<br>
                Use at your own risk. API keys are stored in browser.
            </div>
        </div>
    </div>

    <!-- Main App (hidden until login) -->
    <div class="app-container" id="appContainer" style="display: none;">
        <!-- Tutto il resto del codice originale qui... -->
        <!-- (COPIARE TUTTO IL RESTANTE DEL CODICE ORIGINALE) -->
    </div>

    <script>
        // ==================== CONFIGURAZIONE SICUREZZA ====================
        // Password di accesso (cambiala!)
        const ACCESS_PASSWORD = "MY_SECURE_PASSWORD_123"; // CAMBIA QUESTA PASSWORD!
        
        // API Keys di Binance (cambiale con le tue!)
        const BINANCE_CONFIG = {
            // ⚠️ INSERISCI LE TUE API KEY QUI:
            API_KEY: "TUO_API_KEY_BINANCE", // Sostituisci con la tua API Key
            API_SECRET: "TUO_API_SECRET_BINANCE", // Sostituisci con il tuo API Secret
            
            // Configurazione Binance
            TESTNET: false, // true per testnet, false per mainnet
            BASE_URL: "https://api.binance.com",
            WEBSOCKET_URL: "wss://stream.binance.com:9443/ws",
            FUTURES_URL: "https://fapi.binance.com",
            FUTURES_WEBSOCKET: "wss://fstream.binance.com/ws"
        };

        // ==================== SISTEMA DI LOGIN ====================
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        // Funzione per criptare le API Keys (semplice, non sicura al 100%)
        function simpleEncrypt(text, password) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const charCode = text.charCodeAt(i) ^ password.charCodeAt(i % password.length);
                result += String.fromCharCode(charCode);
            }
            return btoa(result);
        }

        function simpleDecrypt(encrypted, password) {
            try {
                const text = atob(encrypted);
                let result = '';
                for (let i = 0; i < text.length; i++) {
                    const charCode = text.charCodeAt(i) ^ password.charCodeAt(i % password.length);
                    result += String.fromCharCode(charCode);
                }
                return result;
            } catch (e) {
                return null;
            }
        }

        // Salva API keys criptate in localStorage
        function saveEncryptedKeys() {
            const encryptedKey = simpleEncrypt(BINANCE_CONFIG.API_KEY, ACCESS_PASSWORD);
            const encryptedSecret = simpleEncrypt(BINANCE_CONFIG.API_SECRET, ACCESS_PASSWORD);
            
            localStorage.setItem('xtrade_encrypted_key', encryptedKey);
            localStorage.setItem('xtrade_encrypted_secret', encryptedSecret);
            localStorage.setItem('xtrade_keys_saved', 'true');
        }

        // Carica e decripta API keys
        function loadDecryptedKeys(password) {
            try {
                const encryptedKey = localStorage.getItem('xtrade_encrypted_key');
                const encryptedSecret = localStorage.getItem('xtrade_encrypted_secret');
                
                if (!encryptedKey || !encryptedSecret) {
                    // Prima volta: salva le keys
                    saveEncryptedKeys();
                    return {
                        apiKey: BINANCE_CONFIG.API_KEY,
                        apiSecret: BINANCE_CONFIG.API_SECRET
                    };
                }
                
                const apiKey = simpleDecrypt(encryptedKey, password);
                const apiSecret = simpleDecrypt(encryptedSecret, password);
                
                if (!apiKey || !apiSecret) {
                    return null;
                }
                
                return { apiKey, apiSecret };
            } catch (e) {
                return null;
            }
        }

        // Verifica password
        function verifyPassword(password) {
            return password === ACCESS_PASSWORD;
        }

        // Login handler
        loginBtn.addEventListener('click', function() {
            const password = passwordInput.value.trim();
            
            if (!password) {
                loginError.textContent = "Please enter password";
                return;
            }
            
            if (verifyPassword(password)) {
                // Decripta API keys
                const keys = loadDecryptedKeys(password);
                if (!keys) {
                    loginError.textContent = "Failed to load API keys";
                    return;
                }
                
                // Salva keys decriptate in memoria (volatile)
                window.DECRYPTED_API_KEY = keys.apiKey;
                window.DECRYPTED_API_SECRET = keys.apiSecret;
                
                // Nascondi login, mostra app
                loginScreen.classList.add('hidden');
                appContainer.style.display = 'flex';
                
                // Inizializza l'app
                setTimeout(initRealTradingApp, 100);
                
            } else {
                loginError.textContent = "Incorrect password";
                passwordInput.value = '';
            }
        });

        // Enter per login
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        // ==================== REAL TRADING FUNCTIONS ====================
        async function initRealTradingApp() {
            console.log("Initializing real trading...");
            
            // Verifica che le API keys siano caricate
            if (!window.DECRYPTED_API_KEY || !window.DECRYPTED_API_SECRET) {
                alert("API Keys not loaded!");
                return;
            }
            
            // Aggiorna UI per trading reale
            document.title = "XTRADE PRO - Real Trading";
            updateUIToRealMode();
            
            // Inizializza connessione Binance
            await initBinanceConnection();
            
            // Sostituisci le funzioni simulate con quelle reali
            replaceSimulatedFunctions();
            
            // Avvia aggiornamenti reali
            startRealTimeUpdates();
        }

        function updateUIToRealMode() {
            // Modifica titoli e messaggi
            const balanceTitle = document.querySelector('.balance-label');
            if (balanceTitle) balanceTitle.textContent = "REAL BALANCE";
            
            // Aggiungi indicatore di stato API
            const apiStatus = document.createElement('div');
            apiStatus.className = 'api-status connecting';
            apiStatus.id = 'apiStatus';
            apiStatus.textContent = "Connecting to Binance...";
            document.body.appendChild(apiStatus);
        }

        // ==================== BINANCE API FUNCTIONS ====================
        let binanceWs = null;
        let binanceAccountInfo = null;
        
        async function initBinanceConnection() {
            try {
                updateApiStatus('connecting', 'Connecting to Binance...');
                
                // Test API connection
                const accountInfo = await binanceGetAccountInfo();
                if (accountInfo) {
                    binanceAccountInfo = accountInfo;
                    updateApiStatus('connected', `Connected: ${accountInfo.accountType}`);
                    
                    // Aggiorna bilancio
                    updateRealBalance();
                    
                    // Connetti WebSocket per prezzi real-time
                    connectPriceWebSocket();
                    
                    // Connetti WebSocket per ordini
                    connectUserDataWebSocket();
                }
            } catch (error) {
                console.error("Binance connection failed:", error);
                updateApiStatus('disconnected', 'Connection failed');
            }
        }

        function updateApiStatus(status, message) {
            const statusEl = document.getElementById('apiStatus');
            if (statusEl) {
                statusEl.className = `api-status ${status}`;
                statusEl.textContent = message;
            }
        }

        async function binanceGetAccountInfo() {
            try {
                const timestamp = Date.now();
                const queryString = `timestamp=${timestamp}`;
                const signature = await generateSignature(queryString);
                
                const url = `${BINANCE_CONFIG.FUTURES_URL}/fapi/v2/account?${queryString}&signature=${signature}`;
                
                const response = await fetch(url, {
                    headers: {
                        'X-MBX-APIKEY': window.DECRYPTED_API_KEY
                    }
                });
                
                if (!response.ok) throw new Error('API request failed');
                return await response.json();
            } catch (error) {
                console.error("Error getting account info:", error);
                return null;
            }
        }

        async function generateSignature(queryString) {
            // Usa CryptoJS se disponibile, altrimenti fallback semplice
            if (typeof CryptoJS !== 'undefined') {
                return CryptoJS.HmacSHA256(queryString, window.DECRYPTED_API_SECRET).toString();
            } else {
                // Fallback per signature (non sicuro)
                const encoder = new TextEncoder();
                const key = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(window.DECRYPTED_API_SECRET),
                    { name: 'HMAC', hash: 'SHA-256' },
                    false,
                    ['sign']
                );
                const signature = await crypto.subtle.sign(
                    'HMAC',
                    key,
                    encoder.encode(queryString)
                );
                return Array.from(new Uint8Array(signature))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
            }
        }

        function connectPriceWebSocket() {
            if (binanceWs) binanceWs.close();
            
            binanceWs = new WebSocket(`${BINANCE_CONFIG.FUTURES_WEBSOCKET}/btcusdt@ticker`);
            
            binanceWs.onopen = () => {
                console.log("Price WebSocket connected");
                updateApiStatus('connected', 'Live prices connected');
            };
            
            binanceWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateRealTimePrice(data);
            };
            
            binanceWs.onerror = (error) => {
                console.error("WebSocket error:", error);
                updateApiStatus('disconnected', 'Price feed disconnected');
            };
            
            binanceWs.onclose = () => {
                console.log("WebSocket closed");
                // Tentativo riconnessione
                setTimeout(connectPriceWebSocket, 5000);
            };
        }

        function connectUserDataWebSocket() {
            // Creare Listen Key per user data stream
            fetch(`${BINANCE_CONFIG.FUTURES_URL}/fapi/v1/listenKey`, {
                method: 'POST',
                headers: {
                    'X-MBX-APIKEY': window.DECRYPTED_API_KEY
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.listenKey) {
                    const userWs = new WebSocket(`${BINANCE_CONFIG.FUTURES_WEBSOCKET}/${data.listenKey}`);
                    
                    userWs.onmessage = (event) => {
                        const userData = JSON.parse(event.data);
                        handleUserDataUpdate(userData);
                    };
                    
                    // Rinnova listenKey ogni 30 minuti
                    setInterval(() => {
                        fetch(`${BINANCE_CONFIG.FUTURES_URL}/fapi/v1/listenKey`, {
                            method: 'PUT',
                            headers: {
                                'X-MBX-APIKEY': window.DECRYPTED_API_KEY
                            }
                        });
                    }, 1800000);
                }
            });
        }

        function updateRealTimePrice(data) {
            const price = parseFloat(data.c); // Prezzo corrente
            const changePercent = parseFloat(data.P); // Cambio percentuale
            
            // Aggiorna chart con prezzo reale
            if (window.state && window.state.chartData) {
                window.state.currentPrice = price;
                
                // Aggiungi punto al chart
                window.state.chartData.push({
                    time: Date.now(),
                    price: price,
                    volume: parseFloat(data.v)
                });
                
                // Mantieni dimensioni limitate
                if (window.state.chartData.length > 100) {
                    window.state.chartData.shift();
                }
                
                // Aggiorna display
                updatePriceDisplayReal(price, changePercent);
                
                // Aggiorna P&L in tempo reale se trade attivo
                if (window.state.tradeActive) {
                    updateRealTimePLReal();
                }
            }
        }

        function updatePriceDisplayReal(price, changePercent) {
            const priceEl = document.getElementById('currentPrice');
            const indicatorEl = document.getElementById('priceIndicator');
            
            if (priceEl) {
                priceEl.textContent = `$${price.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })}`;
                
                const color = changePercent >= 0 ? '#00ff88' : '#ff4444';
                priceEl.style.background = `linear-gradient(135deg, ${color}, ${changePercent >= 0 ? '#00cc6a' : '#cc3636'})`;
            }
            
            if (indicatorEl) {
                const sign = changePercent >= 0 ? '+' : '';
                indicatorEl.innerHTML = `BTC $${price.toFixed(2)} <span style="color: ${changePercent >= 0 ? '#00ff88' : '#ff4444'}">${sign}${changePercent.toFixed(2)}%</span>`;
            }
        }

        function updateRealBalance() {
            if (!binanceAccountInfo) return;
            
            // Trova asset USDT
            const usdtAsset = binanceAccountInfo.assets.find(a => a.asset === 'USDT');
            if (usdtAsset) {
                const balance = parseFloat(usdtAsset.walletBalance);
                const unrealizedPL = parseFloat(usdtAsset.unrealizedProfit);
                const total = balance + unrealizedPL;
                
                window.state.balance = total;
                window.state.lastBalance = total;
                
                // Aggiorna UI
                updateUIReal();
            }
        }

        function updateUIReal() {
            const balanceEl = document.getElementById('balanceAmount');
            if (balanceEl) {
                balanceEl.textContent = formatCurrencyReal(window.state.balance);
            }
            updateChangeIndicatorReal();
        }

        function formatCurrencyReal(amount) {
            if (amount >= 1000000) return '$' + (amount / 1000000).toFixed(2) + 'M';
            if (amount >= 1000) return '$' + (amount / 1000).toFixed(2) + 'k';
            return '$' + amount.toFixed(2);
        }

        function updateChangeIndicatorReal() {
            // Calcola cambio dal bilancio iniziale o giornaliero
            // Implementa logica specifica
        }

        // ==================== REAL TRADING FUNCTIONS ====================
        async function placeRealTrade(direction) {
            if (!window.state.gameActive || window.state.tradeActive) return;
            
            try {
                const symbol = "BTCUSDT";
                const side = direction.toUpperCase();
                const quantity = calculateRealQuantity();
                const leverage = CONFIG.LEVERAGES[window.state.leverageIndex].value;
                
                // 1. Imposta leva
                await setLeverage(symbol, leverage);
                
                // 2. Piazzo ordine market
                const order = await createOrder(symbol, side, "MARKET", quantity);
                
                if (order && order.orderId) {
                    // 3. Imposta Stop Loss e Take Profit se abilitati
                    if (window.state.stopLossEnabled) {
                        const stopPrice = calculateStopPrice(direction, window.state.currentPrice);
                        await createStopLossOrder(symbol, direction, quantity, stopPrice);
                    }
                    
                    if (window.state.takeProfitEnabled) {
                        const takeProfitPrice = calculateTakeProfitPrice(direction, window.state.currentPrice);
                        await createTakeProfitOrder(symbol, direction, quantity, takeProfitPrice);
                    }
                    
                    // Aggiorna stato trade locale
                    window.state.tradeActive = true;
                    window.state.tradeDirection = direction;
                    window.state.tradeStartPrice = window.state.currentPrice;
                    window.state.tradeStartTime = Date.now();
                    
                    updateTradeUIReal();
                    showNotification(`Trade opened: ${side} ${quantity} BTC at $${window.state.currentPrice}`);
                }
            } catch (error) {
                console.error("Trade error:", error);
                showNotification(`Trade failed: ${error.message}`, 'error');
            }
        }

        async function setLeverage(symbol, leverage) {
            const timestamp = Date.now();
            const queryString = `symbol=${symbol}&leverage=${leverage}&timestamp=${timestamp}`;
            const signature = await generateSignature(queryString);
            
            const response = await fetch(`${BINANCE_CONFIG.FUTURES_URL}/fapi/v1/leverage?${queryString}&signature=${signature}`, {
                method: 'POST',
                headers: {
                    'X-MBX-APIKEY': window.DECRYPTED_API_KEY
                }
            });
            
            return response.json();
        }

        async function createOrder(symbol, side, type, quantity) {
            const timestamp = Date.now();
            const queryString = `symbol=${symbol}&side=${side}&type=${type}&quantity=${quantity}&timestamp=${timestamp}`;
            const signature = await generateSignature(queryString);
            
            const response = await fetch(`${BINANCE_CONFIG.FUTURES_URL}/fapi/v1/order?${queryString}&signature=${signature}`, {
                method: 'POST',
                headers: {
                    'X-MBX-APIKEY': window.DECRYPTED_API_KEY,
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            });
            
            return response.json();
        }

        async function createStopLossOrder(symbol, direction, quantity, stopPrice) {
            const side = direction === 'long' ? 'SELL' : 'BUY';
            const timestamp = Date.now();
            const queryString = `symbol=${symbol}&side=${side}&type=STOP_MARKET&quantity=${quantity}&stopPrice=${stopPrice}&timestamp=${timestamp}`;
            const signature = await generateSignature(queryString);
            
            const response = await fetch(`${BINANCE_CONFIG.FUTURES_URL}/fapi/v1/order?${queryString}&signature=${signature}`, {
                method: 'POST',
                headers: {
                    'X-MBX-APIKEY': window.DECRYPTED_API_KEY
                }
            });
            
            return response.json();
        }

        function calculateRealQuantity() {
            const betPercentage = window.state.betPercentage;
            const balance = window.state.balance;
            const leverage = CONFIG.LEVERAGES[window.state.leverageIndex].value;
            const price = window.state.currentPrice;
            
            const betAmount = balance * (betPercentage / 100);
            const margin = betAmount / leverage;
            const quantity = margin / price;
            
            // Arrotonda alla precisione di Binance
            return parseFloat(quantity.toFixed(3));
        }

        function calculateStopPrice(direction, entryPrice) {
            const percent = window.state.stopLossPercent / 100;
            if (direction === 'long') {
                return entryPrice * (1 - percent);
            } else {
                return entryPrice * (1 + percent);
            }
        }

        function calculateTakeProfitPrice(direction, entryPrice) {
            const percent = window.state.takeProfitPercent / 100;
            if (direction === 'long') {
                return entryPrice * (1 + percent);
            } else {
                return entryPrice * (1 - percent);
            }
        }

        // ==================== SOSTITUZIONE FUNZIONI ====================
        function replaceSimulatedFunctions() {
            // Sostituisci funzioni di trading
            if (window.handleLong) {
                window.handleLong = async function() {
                    await placeRealTrade('long');
                };
            }
            
            if (window.handleShort) {
                window.handleShort = async function() {
                    await placeRealTrade('short');
                };
            }
            
            // Sostituisci funzioni di chiusura
            if (window.closeTradeManually) {
                window.closeTradeManually = async function() {
                    await closeRealTrade();
                };
            }
            
            // Aggiorna funzioni UI
            if (window.updateRealTimePL) {
                window.updateRealTimePL = updateRealTimePLReal;
            }
        }

        function updateRealTimePLReal() {
            if (!window.state.tradeActive) {
                // Reset P&L display
                const plEl = document.getElementById('realTimePL');
                if (plEl) {
                    plEl.classList.remove('active', 'loss');
                }
                return;
            }
            
            // Calcola P&L basato su prezzo corrente
            const priceChangePercent = calculatePriceChangeReal();
            const betAmount = calculateRealQuantity() * window.state.currentPrice;
            const leverage = CONFIG.LEVERAGES[window.state.leverageIndex].value;
            const plAmount = betAmount * (priceChangePercent / 100) * leverage;
            
            window.state.currentPL = plAmount;
            window.state.currentPLPercent = priceChangePercent;
            
            // Aggiorna display
            updatePLDisplayReal(plAmount, priceChangePercent);
        }

        function calculatePriceChangeReal() {
            if (!window.state.tradeActive || !window.state.tradeStartPrice) return 0;
            
            const currentPrice = window.state.currentPrice;
            const startPrice = window.state.tradeStartPrice;
            
            if (window.state.tradeDirection === 'long') {
                return ((currentPrice - startPrice) / startPrice) * 100;
            } else {
                return ((startPrice - currentPrice) / startPrice) * 100;
            }
        }

        function updatePLDisplayReal(plAmount, percent) {
            const plEl = document.getElementById('realTimePL');
            const amountEl = document.getElementById('plAmount');
            const percentEl = document.getElementById('plPercent');
            
            if (plEl && amountEl && percentEl) {
                const sign = plAmount >= 0 ? '+' : '';
                amountEl.textContent = `${sign}${formatCurrencyReal(Math.abs(plAmount))}`;
                percentEl.textContent = `${sign}${percent.toFixed(2)}%`;
                
                if (plAmount > 0) {
                    plEl.className = 'real-time-pl active';
                } else if (plAmount < 0) {
                    plEl.className = 'real-time-pl loss';
                } else {
                    plEl.className = 'real-time-pl';
                }
            }
        }

        async function closeRealTrade() {
            try {
                const symbol = "BTCUSDT";
                const side = window.state.tradeDirection === 'long' ? 'SELL' : 'BUY';
                const quantity = calculateRealQuantity();
                
                // Chiudi posizione
                const order = await createOrder(symbol, side, "MARKET", quantity);
                
                if (order && order.orderId) {
                    // Aggiorna stato
                    window.state.tradeActive = false;
                    window.state.tradeEndPrice = window.state.currentPrice;
                    window.state.tradeResult = calculatePriceChangeReal() > 0;
                    
                    // Aggiorna bilancio
                    await updateRealBalance();
                    
                    // Mostra risultato
                    showTradeResultReal();
                    
                    updateTradeUIReal();
                }
            } catch (error) {
                console.error("Close trade error:", error);
                showNotification(`Close failed: ${error.message}`, 'error');
            }
        }

        function showTradeResultReal() {
            const priceChange = calculatePriceChangeReal();
            const isWin = priceChange > 0;
            
            // Mostra notifica
            showNotification(isWin ? 
                `Trade closed with profit: +${priceChange.toFixed(2)}%` :
                `Trade closed with loss: ${priceChange.toFixed(2)}%`,
                isWin ? 'success' : 'error'
            );
        }

        function updateTradeUIReal() {
            // Implementa logica aggiornamento UI per trade reale
        }

        function showNotification(message, type = 'info') {
            // Crea notifica temporanea
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'success' ? '#00ff88' : type === 'error' ? '#ff4444' : '#00a3ff'};
                color: #000;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 700;
                z-index: 10000;
                animation: slideDown 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function startRealTimeUpdates() {
            // Aggiorna bilancio ogni 30 secondi
            setInterval(updateRealBalance, 30000);
            
            // Aggiorna posizioni aperte ogni 10 secondi
            setInterval(checkOpenPositions, 10000);
        }

        async function checkOpenPositions() {
            try {
                const timestamp = Date.now();
                const queryString = `timestamp=${timestamp}`;
                const signature = await generateSignature(queryString);
                
                const response = await fetch(`${BINANCE_CONFIG.FUTURES_URL}/fapi/v2/positionRisk?${queryString}&signature=${signature}`, {
                    headers: {
                        'X-MBX-APIKEY': window.DECRYPTED_API_KEY
                    }
                });
                
                const positions = await response.json();
                const btcPosition = positions.find(p => p.symbol === "BTCUSDT" && Math.abs(parseFloat(p.positionAmt)) > 0);
                
                if (btcPosition) {
                    // Aggiorna stato trade locale
                    window.state.tradeActive = true;
                    window.state.tradeDirection = parseFloat(btcPosition.positionAmt) > 0 ? 'long' : 'short';
                    window.state.tradeStartPrice = parseFloat(btcPosition.entryPrice);
                    
                    updateTradeUIReal();
                } else {
                    window.state.tradeActive = false;
                    updateTradeUIReal();
                }
            } catch (error) {
                console.error("Error checking positions:", error);
            }
        }

        // Inizializza quando la pagina è carica
        document.addEventListener('DOMContentLoaded', function() {

            script.crossOrigin = 'anonymous';
