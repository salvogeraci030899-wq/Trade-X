<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>XTRADE - Live Crypto Trading</title>
    <style>
        /* Mantieni tutti gli stili precedenti, aggiungi: */
        
        /* Live Trading Specific */
        .live-trading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }
        
        .trade-countdown {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .trade-countdown.positive {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .trade-countdown.negative {
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
        
        .trade-result {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .trade-price-change {
            font-size: 18px;
            color: #888888;
            margin-bottom: 10px;
        }
        
        .result-win {
            color: #00ff88;
        }
        
        .result-loss {
            color: #ff4444;
        }
        
        .live-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 2s infinite;
            z-index: 5;
        }
        
        .live-indicator.active {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .crypto-selector {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .crypto-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
        }
        
        .crypto-select {
            background: transparent;
            border: none;
            color: white;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        
        .trade-timer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #888888;
            z-index: 5;
        }
        
        .trade-timer.active {
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.3);
        }
        
        /* Disable buttons during trade */
        .trade-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Mantieni tutto il codice HTML precedente, aggiungi: -->
    
    <!-- Live Trading Overlay -->
    <div class="live-trading-overlay" id="tradeOverlay">
        <div class="trade-countdown" id="tradeCountdown">5</div>
        <div class="trade-result" id="tradeResultText">TRADE IN PROGRESS</div>
        <div class="trade-price-change" id="tradePriceChange"></div>
        <div class="trade-info" id="tradeInfoOverlay">
            Waiting for price update...
        </div>
    </div>
    
    <!-- Modifica chart overlay per aggiungere selettore crypto -->
    <div class="chart-overlay">
        <div class="crypto-selector">
            <div class="crypto-icon" id="cryptoIcon">₿</div>
            <select class="crypto-select" id="cryptoSelect">
                <option value="bitcoin">BTC/USD</option>
                <option value="ethereum">ETH/USD</option>
                <option value="solana">SOL/USD</option>
                <option value="cardano">ADA/USD</option>
                <option value="dogecoin">DOGE/USD</option>
                <option value="ripple">XRP/USD</option>
            </select>
        </div>
        <div class="chart-badge">
            <div id="currentPriceDisplay">Loading...</div>
            <div id="priceChange24h" style="font-size: 11px; margin-top: 2px;"></div>
        </div>
        <div class="live-indicator" id="liveIndicator">LIVE</div>
    </div>
    
    <!-- Aggiungi timer trade -->
    <div class="trade-timer" id="tradeTimer">
        Trade Available
    </div>

    <script>
        // ==================== CONFIGURAZIONE LIVE TRADING ====================
        const LIVE_TRADING_CONFIG = {
            TRADE_DURATION: 5, // secondi
            CHECK_INTERVAL: 30000, // Aggiornamento dati ogni 30 secondi
            CRYPTO_OPTIONS: [
                { id: 'bitcoin', name: 'Bitcoin', symbol: 'BTC', icon: '₿', color: '#f7931a' },
                { id: 'ethereum', name: 'Ethereum', symbol: 'ETH', icon: 'Ξ', color: '#627eea' },
                { id: 'solana', name: 'Solana', symbol: 'SOL', icon: '◎', color: '#00ffa3' },
                { id: 'cardano', name: 'Cardano', symbol: 'ADA', icon: 'A', color: '#0033ad' },
                { id: 'dogecoin', name: 'Dogecoin', symbol: 'DOGE', icon: 'Ð', color: '#c2a633' },
                { id: 'ripple', name: 'XRP', symbol: 'XRP', icon: 'XRP', color: '#23292f' }
            ],
            API_PROVIDER: 'coingecko' // 'coingecko' o 'binance'
        };

        // ==================== STATO LIVE TRADING ====================
        let liveTradingState = {
            isActive: false,
            selectedCrypto: 'bitcoin',
            currentPrice: 0,
            entryPrice: 0,
            tradeStartTime: null,
            tradeInProgress: false,
            tradeDirection: null, // 'long' o 'short'
            lastPriceUpdate: null,
            priceHistory: [],
            chartData: [],
            updateInterval: null,
            realtimeUpdateInterval: null
        };

        // ==================== INIZIALIZZAZIONE LIVE TRADING ====================
        async function initLiveTrading() {
            try {
                // Carica crypto salvata
                const savedCrypto = localStorage.getItem('xtrade_selected_crypto');
                if (savedCrypto) {
                    liveTradingState.selectedCrypto = savedCrypto;
                    dom.cryptoSelect.value = savedCrypto;
                    updateCryptoIcon();
                }
                
                // Inizializza dati
                await updateCryptoData();
                
                // Avvia aggiornamenti periodici
                startPeriodicUpdates();
                
                // Avvia aggiornamento grafico in tempo reale
                startRealtimeChart();
                
                return true;
            } catch (error) {
                console.error('Errore inizializzazione live trading:', error);
                return false;
            }
        }

        function updateCryptoIcon() {
            const crypto = LIVE_TRADING_CONFIG.CRYPTO_OPTIONS.find(c => c.id === liveTradingState.selectedCrypto);
            if (crypto) {
                dom.cryptoIcon.textContent = crypto.icon;
                dom.cryptoIcon.style.background = crypto.color + '40';
                dom.cryptoIcon.style.color = crypto.color;
            }
        }

        // ==================== API FUNCTIONS ====================
        async function updateCryptoData() {
            try {
                const priceData = await fetchCurrentPrice();
                const chartData = await fetchChartData();
                
                if (priceData && chartData) {
                    liveTradingState.currentPrice = priceData.price;
                    liveTradingState.priceHistory = chartData;
                    liveTradingState.lastPriceUpdate = Date.now();
                    
                    // Aggiorna display
                    updatePriceDisplay(priceData);
                    
                    // Aggiorna grafico
                    updateChartWithRealData(chartData);
                    
                    // Abilita bottoni trade
                    dom.longBtn.disabled = false;
                    dom.shortBtn.disabled = false;
                    dom.tradeTimer.textContent = 'Trade Available';
                    dom.tradeTimer.classList.add('active');
                    
                    return true;
                } else {
                    throw new Error('Dati non disponibili');
                }
            } catch (error) {
                console.error('Errore aggiornamento dati crypto:', error);
                
                // Disabilita trading
                dom.longBtn.disabled = true;
                dom.shortBtn.disabled = true;
                dom.tradeTimer.textContent = 'Data Unavailable';
                dom.tradeTimer.classList.remove('active');
                
                return false;
            }
        }

        async function fetchCurrentPrice() {
            try {
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/simple/price?ids=${liveTradingState.selectedCrypto}&vs_currencies=usd&include_24hr_change=true`
                );
                const data = await response.json();
                
                if (data[liveTradingState.selectedCrypto]) {
                    return {
                        price: data[liveTradingState.selectedCrypto].usd,
                        change24h: data[liveTradingState.selectedCrypto].usd_24h_change || 0
                    };
                }
                return null;
            } catch (error) {
                console.error('Errore fetch prezzo corrente:', error);
                return null;
            }
        }

        async function fetchChartData() {
            try {
                // Ultime 24 ore, dati ogni 5 minuti
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/coins/${liveTradingState.selectedCrypto}/market_chart?vs_currency=usd&days=1&interval=5`
                );
                const data = await response.json();
                
                if (data.prices && data.prices.length > 0) {
                    return processChartData(data.prices);
                }
                return [];
            } catch (error) {
                console.error('Errore fetch dati grafico:', error);
                return [];
            }
        }

        function processChartData(priceData) {
            // Converte in formato candele (5 minuti ciascuna)
            const candles = [];
            
            for (let i = 0; i < priceData.length; i += 12) { // 12 punti = 1 ora di dati (5 min x 12 = 60 min)
                const hourData = priceData.slice(i, i + 12);
                if (hourData.length === 0) continue;
                
                const prices = hourData.map(p => p[1]);
                const open = prices[0];
                const close = prices[prices.length - 1];
                const high = Math.max(...prices);
                const low = Math.min(...prices);
                
                candles.push({
                    timestamp: hourData[0][0],
                    open: open,
                    high: high,
                    low: low,
                    close: close,
                    isBullish: close >= open
                });
            }
            
            return candles.slice(-30); // Ultime 30 candele
        }

        // ==================== GRAFICO LIVE ====================
        function updateChartWithRealData(chartData) {
            if (chartData.length === 0) return;
            
            liveTradingState.chartData = chartData;
            
            // Crea dati per il rendering
            state.candleData = chartData.map((candle, index) => ({
                open: candle.open,
                high: candle.high,
                low: candle.low,
                close: candle.close,
                isBullish: candle.isBullish,
                index: index,
                isRealData: true
            }));
            
            // Imposta punto di decisione (ora corrente)
            state.decisionPoint = state.candleData.length - 1;
            state.chartStep = state.candleData.length;
            
            // Ridisegna il grafico
            drawCandleChart();
            
            // Aggiorna indicatore live
            dom.liveIndicator.classList.add('active');
        }

        function updatePriceDisplay(priceData) {
            const crypto = LIVE_TRADING_CONFIG.CRYPTO_OPTIONS.find(c => c.id === liveTradingState.selectedCrypto);
            const priceFormatted = formatCryptoPrice(priceData.price);
            const changeFormatted = priceData.change24h.toFixed(2);
            const changeColor = priceData.change24h >= 0 ? '#00ff88' : '#ff4444';
            
            dom.currentPriceDisplay.innerHTML = `
                <div style="font-size: 14px; font-weight: 700; color: ${crypto?.color || '#ffffff'}">
                    ${crypto?.symbol || 'CRYPTO'}: ${priceFormatted}
                </div>
            `;
            
            dom.priceChange24h.innerHTML = `
                <span style="color: ${changeColor}">${changeFormatted}%</span> (24h)
            `;
        }

        function formatCryptoPrice(price) {
            if (price >= 1000) {
                return '$' + price.toLocaleString('en-US', {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                });
            } else if (price >= 1) {
                return '$' + price.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            } else {
                return '$' + price.toLocaleString('en-US', {
                    minimumFractionDigits: 4,
                    maximumFractionDigits: 4
                });
            }
        }

        // ==================== GESTIONE TRADE ====================
        async function executeLiveTrade(direction) {
            if (liveTradingState.tradeInProgress) return;
            
            // Disabilita bottoni
            dom.longBtn.disabled = true;
            dom.shortBtn.disabled = true;
            
            // Salva prezzo di ingresso
            liveTradingState.entryPrice = liveTradingState.currentPrice;
            liveTradingState.tradeDirection = direction;
            liveTradingState.tradeStartTime = Date.now();
            liveTradingState.tradeInProgress = true;
            
            // Mostra overlay trade
            showTradeOverlay();
            
            // Avvia countdown
            startTradeCountdown();
        }

        function showTradeOverlay() {
            dom.tradeOverlay.style.display = 'flex';
            dom.tradeCountdown.textContent = LIVE_TRADING_CONFIG.TRADE_DURATION;
            dom.tradeCountdown.className = 'trade-countdown';
            dom.tradeResultText.textContent = 'TRADE IN PROGRESS';
            dom.tradeResultText.className = 'trade-result';
            dom.tradePriceChange.textContent = `Entry: ${formatCryptoPrice(liveTradingState.entryPrice)}`;
        }

        function startTradeCountdown() {
            let secondsLeft = LIVE_TRADING_CONFIG.TRADE_DURATION;
            
            const countdownInterval = setInterval(() => {
                secondsLeft--;
                dom.tradeCountdown.textContent = secondsLeft;
                
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                    checkTradeResult();
                }
            }, 1000);
        }

        async function checkTradeResult() {
            try {
                // Ottieni nuovo prezzo
                const priceData = await fetchCurrentPrice();
                if (!priceData) {
                    throw new Error('Impossibile ottenere prezzo');
                }
                
                const exitPrice = priceData.price;
                const priceChange = exitPrice - liveTradingState.entryPrice;
                const priceChangePercent = (priceChange / liveTradingState.entryPrice) * 100;
                
                // Determina se il trade è vincente
                let isWin = false;
                if (liveTradingState.tradeDirection === 'long') {
                    isWin = priceChange > 0;
                } else {
                    isWin = priceChange < 0;
                }
                
                // Mostra risultato
                displayTradeResult(isWin, exitPrice, priceChange, priceChangePercent);
                
                // Calcola payout
                const payout = calculateLiveTradePayout(isWin);
                
                // Aggiorna balance dopo 2 secondi
                setTimeout(() => {
                    completeLiveTrade(isWin, payout);
                }, 2000);
                
            } catch (error) {
                console.error('Errore verifica trade:', error);
                dom.tradeResultText.textContent = 'TRADE ERROR';
                dom.tradeResultText.className = 'trade-result result-loss';
                dom.tradeInfoOverlay.textContent = 'Please try again';
                
                setTimeout(() => {
                    resetTradeState();
                }, 2000);
            }
        }

        function displayTradeResult(isWin, exitPrice, priceChange, priceChangePercent) {
            const direction = liveTradingState.tradeDirection.toUpperCase();
            const changeFormatted = priceChangePercent.toFixed(2);
            const changeColor = priceChange >= 0 ? '#00ff88' : '#ff4444';
            const changeSign = priceChange >= 0 ? '+' : '';
            
            dom.tradeCountdown.className = `trade-countdown ${isWin ? 'positive' : 'negative'}`;
            dom.tradeCountdown.textContent = isWin ? 'WIN!' : 'LOSS';
            
            dom.tradeResultText.textContent = `${direction} ${isWin ? 'WON' : 'LOST'}`;
            dom.tradeResultText.className = `trade-result ${isWin ? 'result-win' : 'result-loss'}`;
            
            dom.tradePriceChange.textContent = 
                `Exit: ${formatCryptoPrice(exitPrice)} (${changeSign}${changeFormatted}%)`;
            dom.tradePriceChange.style.color = changeColor;
            
            dom.tradeInfoOverlay.innerHTML = `
                Entry: <strong>${formatCryptoPrice(liveTradingState.entryPrice)}</strong><br>
                Exit: <strong>${formatCryptoPrice(exitPrice)}</strong><br>
                Change: <strong style="color: ${changeColor}">${changeSign}${changeFormatted}%</strong>
            `;
        }

        function calculateLiveTradePayout(isWin) {
            const betAmount = calculateBetAmount();
            const leverage = CONFIG.LEVERAGES[state.leverageIndex].value;
            
            if (isWin) {
                // Vincita: guadagno = bet * leverage
                return betAmount * leverage;
            } else {
                // Perdita: perdita = bet * leverage
                return -betAmount * leverage;
            }
        }

        function completeLiveTrade(isWin, payout) {
            // Aggiorna stato
            state.balance += payout;
            state.totalTrades++;
            
            if (isWin) {
                state.wins++;
                state.leverageStats[CONFIG.LEVERAGES[state.leverageIndex].value].wins++;
            }
            state.leverageStats[CONFIG.LEVERAGES[state.leverageIndex].value].total++;
            
            // Aggiorna best balance
            if (state.balance > state.bestBalance) {
                state.bestBalance = state.balance;
            }
            
            // Check bankruptcy
            if (state.balance <= 0) {
                state.gameActive = false;
                dom.gameOverScreen.style.display = 'flex';
            }
            
            // Aggiorna UI
            updateUI();
            saveGameState();
            
            // Nascondi overlay e reset
            setTimeout(() => {
                resetTradeState();
                
                // Aggiorna dati per nuovo trade
                updateCryptoData();
            }, 1000);
        }

        function resetTradeState() {
            dom.tradeOverlay.style.display = 'none';
            liveTradingState.tradeInProgress = false;
            liveTradingState.tradeDirection = null;
            liveTradingState.entryPrice = 0;
            
            // Riabilita bottoni dopo aggiornamento dati
            dom.tradeTimer.textContent = 'Updating...';
            dom.tradeTimer.classList.remove('active');
        }

        // ==================== AGGIORNAMENTI AUTOMATICI ====================
        function startPeriodicUpdates() {
            if (liveTradingState.updateInterval) {
                clearInterval(liveTradingState.updateInterval);
            }
            
            liveTradingState.updateInterval = setInterval(async () => {
                if (!liveTradingState.tradeInProgress) {
                    await updateCryptoData();
                }
            }, LIVE_TRADING_CONFIG.CHECK_INTERVAL);
        }

        function startRealtimeChart() {
            if (liveTradingState.realtimeUpdateInterval) {
                clearInterval(liveTradingState.realtimeUpdateInterval);
            }
            
            // Simula movimento in tempo reale ogni 2 secondi
            liveTradingState.realtimeUpdateInterval = setInterval(() => {
                if (!liveTradingState.tradeInProgress && liveTradingState.chartData.length > 0) {
                    simulateRealTimeMovement();
                }
            }, 2000);
        }

        function simulateRealTimeMovement() {
            if (state.candleData.length === 0) return;
            
            // Prendi ultima candela
            const lastCandle = state.candleData[state.candleData.length - 1];
            
            // Simula piccolo movimento basato sulla volatilità
            const volatility = 0.001; // 0.1%
            const change = (Math.random() - 0.5) * 2 * volatility * lastCandle.close;
            const newClose = lastCandle.close + change;
            
            // Crea nuova "candela" per l'aggiornamento in tempo reale
            const newCandle = {
                open: lastCandle.close,
                close: newClose,
                high: Math.max(lastCandle.close, newClose) * (1 + Math.random() * volatility),
                low: Math.min(lastCandle.close, newClose) * (1 - Math.random() * volatility),
                isBullish: newClose >= lastCandle.close,
                index: state.candleData.length,
                isRealData: true,
                isRealtime: true
            };
            
            // Aggiorna prezzo corrente
            liveTradingState.currentPrice = newClose;
            
            // Aggiorna display prezzo
            const crypto = LIVE_TRADING_CONFIG.CRYPTO_OPTIONS.find(c => c.id === liveTradingState.selectedCrypto);
            dom.currentPriceDisplay.innerHTML = `
                <div style="font-size: 14px; font-weight: 700; color: ${crypto?.color || '#ffffff'}">
                    ${crypto?.symbol || 'CRYPTO'}: ${formatCryptoPrice(newClose)}
                </div>
            `;
            
            // Ridisegna grafico con movimento in tempo reale
            if (!liveTradingState.tradeInProgress && state.currentPage === 'trading') {
                drawLiveChartWithMovement(newCandle);
            }
        }

        function drawLiveChartWithMovement(newCandle) {
            const ctx = dom.chartCtx;
            const width = dom.chartCanvas.width / (window.devicePixelRatio || 1);
            const height = dom.chartCanvas.height / (window.devicePixelRatio || 1);
            
            // Calcola posizione per la candela in tempo reale
            const candleWidth = (width * 0.8) / 30;
            const x = width * 0.1 + 29 * candleWidth;
            
            // Calcola coordinate Y
            let minPrice = Infinity;
            let maxPrice = -Infinity;
            
            state.candleData.forEach(candle => {
                minPrice = Math.min(minPrice, candle.low);
                maxPrice = Math.max(maxPrice, candle.high);
            });
            minPrice = Math.min(minPrice, newCandle.low);
            maxPrice = Math.max(maxPrice, newCandle.high);
            
            const priceRange = maxPrice - minPrice;
            const padding = priceRange * 0.1;
            minPrice -= padding;
            maxPrice += padding;
            const actualRange = maxPrice - minPrice;
            
            // Disegna la candela in tempo reale
            const yHigh = height - ((newCandle.high - minPrice) / actualRange * height);
            const yLow = height - ((newCandle.low - minPrice) / actualRange * height);
            const yOpen = height - ((newCandle.open - minPrice) / actualRange * height);
            const yClose = height - ((newCandle.close - minPrice) / actualRange * height);
            
            const color = newCandle.isBullish ? '#00ff88' : '#ff4444';
            
            // Corpo
            ctx.fillStyle = color + '80'; // 50% opacity
            const yTop = Math.min(yOpen, yClose);
            const yBottom = Math.max(yOpen, yClose);
            const bodyHeight = Math.max(1, yBottom - yTop);
            
            ctx.fillRect(x, yTop, candleWidth * 0.7, bodyHeight);
            
            // Stoppini
            ctx.strokeStyle = color + '80';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + candleWidth * 0.35, yHigh);
            ctx.lineTo(x + candleWidth * 0.35, yTop);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + candleWidth * 0.35, yBottom);
            ctx.lineTo(x + candleWidth * 0.35, yLow);
            ctx.stroke();
        }

        // ==================== MODIFICHE ALLE FUNZIONI ESISTENTI ====================
        function initGame() {
            setupCanvas();
            createLeverageDots();
            loadGameState();
            setupEventListeners();
            
            // Inizializza live trading
            initLiveTrading().then(success => {
                if (!success) {
                    // Fallback a dati simulati
                    startNewRound();
                }
            });
            
            updateUI();
            updateSliderThumbs();
            updateDockActiveState();
        }

        function handleLong() {
            if (!state.gameActive || liveTradingState.tradeInProgress || dom.longBtn.disabled) return;
            
            // Esegue live trade
            executeLiveTrade('long');
        }

        function handleShort() {
            if (!state.gameActive || liveTradingState.tradeInProgress || dom.shortBtn.disabled) return;
            
            // Esegue live trade
            executeLiveTrade('short');
        }

        // Aggiorna drawCandleChart per mostrare dati live
        function drawCandleChart() {
            // ... codice esistente ...
            
            // Aggiungi indicatore "NOW" sulla candela corrente
            if (state.candleData.length > 0 && liveTradingState.isActive) {
                const currentCandle = state.candleData[state.candleData.length - 1];
                const x = xOffset + (state.candleData.length - 1) * candleWidth + candleWidth/2 + candleSpacing/2;
                const y = height - ((currentCandle.close - minPrice) / actualRange * height);
                
                // Punto "NOW"
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Etichetta "NOW"
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px Arial';
                ctx.fillText('NOW', x - 10, y - 10);
            }
            
            // ... resto del codice ...
        }

        // Event listener per cambio crypto
        dom.cryptoSelect.addEventListener('change', async function() {
            liveTradingState.selectedCrypto = this.value;
            localStorage.setItem('xtrade_selected_crypto', this.value);
            
            updateCryptoIcon();
            
            // Disabilita trading durante aggiornamento
            dom.longBtn.disabled = true;
            dom.shortBtn.disabled = true;
            dom.tradeTimer.textContent = 'Loading...';
            dom.tradeTimer.classList.remove('active');
            
            // Aggiorna dati
            await updateCryptoData();
        });

        // ==================== AVVIO ====================
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
