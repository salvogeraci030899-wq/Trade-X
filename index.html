<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>XTrade - Sistema Leva Progressiva con Tasse</title>
    <style>
        /* Stili rimangono gli stessi... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        * {
            -webkit-user-drag: none;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Animazioni */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }
        
        .game-title {
            text-align: center;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            padding: 10px 20px;
            border-bottom: 1px solid #222;
            background: #000;
            color: #fff;
            position: relative;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 6s ease-in-out infinite;
        }
        
        .header {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #222;
        }
        
        .balance-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .balance-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .balance-label {
            color: #888;
            font-weight: 300;
            min-width: 80px;
        }
        
        .balance-value {
            font-weight: 400;
        }
        
        #bestBalance {
            color: #4CAF50;
        }
        
        #balance {
            color: #fff;
        }
        
        #chartCanvas {
            flex: 1;
            width: 100%;
            display: block;
            touch-action: none;
        }
        
        .controls-container {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .leverage-controls {
            display: flex;
            gap: 20px;
        }
        
        .control {
            flex: 1;
            min-width: 0;
        }
        
        .control label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #888;
            letter-spacing: 0.3px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 2px;
            background: #333;
            -webkit-appearance: none;
            outline: none;
            touch-action: pan-y;
            min-width: 0;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            min-width: 45px;
            font-size: 14px;
            text-align: right;
        }
        
        .trade-buttons {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        
        .trade-btn {
            flex: 1;
            height: 50px;
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        
        .trade-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .trade-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .long-btn {
            border-color: #0c0;
            color: #0c0;
        }
        
        .short-btn {
            border-color: #f00;
            color: #f00;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            height: 36px;
            color: #888;
            letter-spacing: 0.3px;
        }
        
        .bet-info {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            height: 60px;
            line-height: 1.4;
        }
        
        .unlock-info {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            height: 16px;
            transition: opacity 0.5s ease-out;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #222;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over h2 {
            font-size: 40px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ff0000;
            animation: float 3s ease-in-out infinite;
        }
        
        .restart-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        .win-animation {
            animation: pulse 0.5s ease-in-out 3;
        }
        
        .loss-animation {
            animation: shake 0.5s ease-in-out;
        }
        
        @media (max-width: 380px) {
            .controls-container {
                padding: 15px 12px;
            }
            
            .leverage-controls {
                gap: 12px;
            }
            
            .slider-value {
                min-width: 40px;
                font-size: 12px;
            }
            
            .trade-btn {
                font-size: 16px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="game-title">XTrade</div>
    
    <div class="header">
        <div class="balance-container">
            <div class="balance-row">
                <div class="balance-label">Record:</div>
                <div class="balance-value" id="bestBalance">$100</div>
            </div>
            <div class="balance-row">
                <div class="balance-label">Saldo:</div>
                <div class="balance-value" id="balance">$100</div>
            </div>
        </div>
    </div>
    
    <canvas id="chartCanvas"></canvas>
    
    <div class="status" id="statusMessage">Analisi del mercato...</div>
    
    <div class="controls-container">
        <div class="leverage-controls">
            <div class="control">
                <label>PUNTATA (%)</label>
                <div class="slider-container">
                    <input type="range" min="1" max="100" value="10" id="percentageSlider">
                    <span class="slider-value" id="percentageValue">10%</span>
                </div>
            </div>
            <div class="control">
                <label>LEVA (RISCHIO)</label>
                <div class="slider-container">
                    <input type="range" min="0" max="7" value="0" id="leverageSlider">
                    <span class="slider-value" id="leverageValue">1x</span>
                </div>
            </div>
        </div>
        
        <div class="bet-info" id="betInfo">Puntata: $10 (10%) | Leva: 1x (80% win) | Tassa: 5%</div>
        
        <div class="unlock-info" id="unlockInfo"></div>
        
        <div class="trade-buttons">
            <button id="longBtn" class="trade-btn long-btn" disabled>▲ LONG</button>
            <button id="shortBtn" class="trade-btn short-btn" disabled>▼ SHORT</button>
        </div>
    </div>
    
    <div class="stats">
        <div>Livello: <span id="currentLevel">Novizio</span></div>
        <div>Leve sbloccate: <span id="unlockedCount">1/8</span></div>
        <div>Trade: <span id="totalTrades">0</span></div>
    </div>
    
    <div class="game-over" id="gameOverScreen">
        <h2>BANCAROTTA</h2>
        <button id="restartBtn" class="restart-btn">RIPROVA</button>
    </div>

    <script>
        // ==================== SISTEMA LEVE E TASSE ====================
        const LEVERAGE_SETTINGS = [
            { leverage: 1, winChance: 0.80, tax: 0.05, color: "#44ff44", name: "Novizio", level: "Basso" },
            { leverage: 2, winChance: 0.70, tax: 0.13, color: "#66ff66", name: "Principiante", level: "Medio" },
            { leverage: 3, winChance: 0.60, tax: 0.21, color: "#88ff88", name: "Intermedio", level: "Medio" },
            { leverage: 5, winChance: 0.50, tax: 0.37, color: "#ffff44", name: "Esperto", level: "Medio" },
            { leverage: 10, winChance: 0.40, tax: 0.77, color: "#ffaa44", name: "Risky", level: "Alto" },
            { leverage: 20, winChance: 0.30, tax: 0.85, color: "#ff7744", name: "High Risk", level: "Alto" },
            { leverage: 50, winChance: 0.20, tax: 0.85, color: "#ff4444", name: "Extreme", level: "Estremo" },
            { leverage: 100, winChance: 0.10, tax: 0.85, color: "#ff2244", name: "Insano", level: "Insano" }
        ];

        const LEVERAGE_UNLOCKS = [
            { threshold: 100, maxLeverageIndex: 0 },
            { threshold: 200, maxLeverageIndex: 1 },
            { threshold: 300, maxLeverageIndex: 2 },
            { threshold: 500, maxLeverageIndex: 3 },
            { threshold: 1000, maxLeverageIndex: 4 },
            { threshold: 2000, maxLeverageIndex: 5 },
            { threshold: 5000, maxLeverageIndex: 6 },
            { threshold: 10000, maxLeverageIndex: 7 }
        ];

        // ==================== VARIABILI GLOBALI ====================
        let balance = 100;
        let bestBalance = 100;
        let chartData = [];
        let chartStep = 0;
        let gameActive = true;
        let isAnimating = true;
        let animationId = null;
        let decisionPoint = 0;
        let userChoice = null;
        let chartColor = "#fff";
        let tradeResult = null;
        
        let betPercentage = 10;
        let leverageIndex = 0;
        let leverage = 1;
        
        let totalTrades = 0;
        let wins = 0;
        let losses = 0;
        let totalWon = 0;
        let totalLost = 0;
        let leverageUsed = [];
        let currentStreak = 0;
        let bestStreak = 0;
        let unlockMessageTimeout = null;

        // ==================== ELEMENTI DOM ====================
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d', { antialias: false });
        ctx.imageSmoothingEnabled = false;
        
        const balanceElement = document.getElementById('balance');
        const bestBalanceElement = document.getElementById('bestBalance');
        const longBtn = document.getElementById('longBtn');
        const shortBtn = document.getElementById('shortBtn');
        const statusMessage = document.getElementById('statusMessage');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');
        const percentageSlider = document.getElementById('percentageSlider');
        const percentageValue = document.getElementById('percentageValue');
        const leverageSlider = document.getElementById('leverageSlider');
        const leverageValue = document.getElementById('leverageValue');
        const betInfo = document.getElementById('betInfo');
        const unlockInfo = document.getElementById('unlockInfo');
        const currentLevelElement = document.getElementById('currentLevel');
        const unlockedCountElement = document.getElementById('unlockedCount');
        const totalTradesElement = document.getElementById('totalTrades');

        // ==================== FUNZIONI HELPER ====================
        function getCurrentLeverageSettings() {
            return LEVERAGE_SETTINGS[leverageIndex];
        }

        function getMaxUnlockedLeverageIndex() {
            for (let i = LEVERAGE_UNLOCKS.length - 1; i >= 0; i--) {
                if (balance >= LEVERAGE_UNLOCKS[i].threshold) {
                    return LEVERAGE_UNLOCKS[i].maxLeverageIndex;
                }
            }
            return 0;
        }

        function getNextUnlock() {
            const currentMaxIndex = getMaxUnlockedLeverageIndex();
            
            for (let unlock of LEVERAGE_UNLOCKS) {
                if (unlock.maxLeverageIndex > currentMaxIndex) {
                    const settings = LEVERAGE_SETTINGS[unlock.maxLeverageIndex];
                    return {
                        threshold: unlock.threshold,
                        leverage: settings.leverage,
                        winChance: settings.winChance,
                        tax: settings.tax,
                        remaining: unlock.threshold - balance
                    };
                }
            }
            return null;
        }

        function isTradeSuccessful() {
            const settings = getCurrentLeverageSettings();
            return Math.random() < settings.winChance;
        }

        // FUNZIONE CORRETTA: APPLICA LE TASSE
        function calculateTradeResult(isWin, betAmount) {
            const settings = getCurrentLeverageSettings();
            
            if (isWin) {
                const grossProfit = betAmount * settings.leverage;
                const tax = grossProfit * settings.tax;
                const netProfit = grossProfit - tax;
                return netProfit;
            } else {
                return -betAmount;
            }
        }

        // ==================== FUNZIONI CORE ====================
        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
        }

        function loadGameState() {
            const savedBalance = localStorage.getItem('tradingBalance');
            const savedBestBalance = localStorage.getItem('tradingBestBalance');
            const savedPercentage = localStorage.getItem('tradingPercentage');
            const savedLeverageIndex = localStorage.getItem('tradingLeverageIndex');
            const savedTotalTrades = localStorage.getItem('tradingTotalTrades');
            
            if (savedBalance) balance = parseInt(savedBalance);
            if (savedBestBalance) bestBalance = parseInt(savedBestBalance);
            if (savedPercentage) {
                betPercentage = parseInt(savedPercentage);
                percentageSlider.value = betPercentage;
                percentageValue.textContent = `${betPercentage}%`;
            }
            if (savedLeverageIndex) {
                leverageIndex = parseInt(savedLeverageIndex);
                leverageSlider.value = leverageIndex;
                const settings = LEVERAGE_SETTINGS[leverageIndex];
                leverage = settings.leverage;
                leverageValue.textContent = `${leverage}x`;
            }
            if (savedTotalTrades) {
                totalTrades = parseInt(savedTotalTrades);
                totalTradesElement.textContent = totalTrades;
            }
            
            updateBalanceDisplay();
            updateLeverageControls();
            updateBetInfo();
            updateUnlockInfo();
            updateStats();
        }

        function saveGameState() {
            localStorage.setItem('tradingBalance', balance.toString());
            localStorage.setItem('tradingBestBalance', bestBalance.toString());
            localStorage.setItem('tradingPercentage', betPercentage.toString());
            localStorage.setItem('tradingLeverageIndex', leverageIndex.toString());
            localStorage.setItem('tradingTotalTrades', totalTrades.toString());
        }

        function updateBalanceDisplay() {
            balanceElement.textContent = "$" + balance;
            bestBalanceElement.textContent = "$" + bestBalance;
        }

        function calculateBet() {
            return Math.floor(balance * (betPercentage / 100));
        }

        function updateLeverageControls() {
            const maxUnlockedIndex = getMaxUnlockedLeverageIndex();
            
            if (leverageIndex > maxUnlockedIndex) {
                leverageIndex = maxUnlockedIndex;
                leverageSlider.value = leverageIndex;
                const settings = LEVERAGE_SETTINGS[leverageIndex];
                leverage = settings.leverage;
                leverageValue.textContent = `${leverage}x`;
            }
            
            leverageSlider.max = maxUnlockedIndex;
            
            const settings = getCurrentLeverageSettings();
            leverageValue.style.color = settings.color;
        }

        function updateBetInfo() {
            const settings = getCurrentLeverageSettings();
            const bet = calculateBet();
            const winChance = Math.round(settings.winChance * 100);
            const taxPercent = Math.round(settings.tax * 100);
            const netWin = (bet * settings.leverage * (1 - settings.tax)).toFixed(2);
            const potentialLoss = bet;
            
            let info = `Puntata: $${bet} (${betPercentage}%) | Leva: ${settings.leverage}x`;
            info += `<br>Probabilità: ${winChance}% | Tassa: ${taxPercent}%`;
            info += `<br>Se vinci: +$${netWin} netti | Se perdi: -$${potentialLoss}`;
            
            betInfo.innerHTML = info;
            betInfo.style.color = settings.color;
            
            if (settings.winChance <= 0.3) {
                betInfo.classList.add('high-risk');
            } else {
                betInfo.classList.remove('high-risk');
            }
        }

        function updateUnlockInfo() {
            if (unlockMessageTimeout) {
                clearTimeout(unlockMessageTimeout);
                unlockMessageTimeout = null;
            }
            
            const next = getNextUnlock();
            const maxUnlockedIndex = getMaxUnlockedLeverageIndex();
            
            unlockInfo.classList.remove('fade-out');
            
            if (next) {
                const winChance = Math.round(next.winChance * 100);
                const taxPercent = Math.round(next.tax * 100);
                unlockInfo.textContent = `Prossimo: ${next.leverage}x (${winChance}% win, ${taxPercent}% tassa) a $${next.threshold}`;
                unlockInfo.style.color = "#ffaa44";
            } else {
                unlockInfo.textContent = "Tutte le leve sbloccate!";
                unlockInfo.style.color = "#44ff44";
                
                unlockMessageTimeout = setTimeout(() => {
                    unlockInfo.classList.add('fade-out');
                }, 3000);
            }
            
            unlockedCountElement.textContent = `${maxUnlockedIndex + 1}/${LEVERAGE_SETTINGS.length}`;
        }

        function updateStats() {
            const settings = getCurrentLeverageSettings();
            currentLevelElement.textContent = settings.level;
            currentLevelElement.style.color = settings.color;
        }

        // ==================== GRAFICO ====================
        function generateChartData(length, startValue, trendStrength = 0) {
            const data = [];
            let value = startValue || 50;
            
            for (let i = 0; i < length; i++) {
                value += (Math.random() - 0.5) * 1.5 + trendStrength;
                
                if (value < 5) value = 5 + Math.random() * 5;
                if (value > 95) value = 95 - Math.random() * 5;
                
                data.push(value);
            }
            
            return data;
        }

        function drawChart() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (chartData.length === 0) return;
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            
            const minValue = Math.min(...chartData);
            const maxValue = Math.max(...chartData);
            const valueRange = maxValue - minValue || 1;
            
            const scaleY = height / valueRange;
            const stepX = width / (chartData.length - 1);
            
            ctx.strokeStyle = chartColor;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            for (let i = 0; i < Math.min(chartStep, chartData.length); i++) {
                const x = i * stepX;
                const y = height - ((chartData[i] - minValue) * scaleY);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            
            if (userChoice && decisionPoint > 0 && chartStep > decisionPoint) {
                const decisionX = decisionPoint * stepX;
                const decisionY = height - ((chartData[decisionPoint] - minValue) * scaleY);
                
                ctx.fillStyle = chartColor;
                ctx.beginPath();
                ctx.arc(decisionX, decisionY, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateChart() {
            if (chartStep < chartData.length) {
                chartStep++;
                drawChart();
                
                if (isAnimating && chartStep <= decisionPoint) {
                    setTimeout(() => {
                        animationId = requestAnimationFrame(animateChart);
                    }, 8 + Math.random() * 4);
                } 
                else if (userChoice && chartStep > decisionPoint) {
                    setTimeout(() => {
                        animationId = requestAnimationFrame(animateChart);
                    }, 8 + Math.random() * 4);
                } 
                else if (chartStep > decisionPoint && !userChoice) {
                    isAnimating = false;
                    enableTradeButtons();
                    statusMessage.textContent = "Previsione?";
                    return;
                }
                else {
                    animationId = requestAnimationFrame(animateChart);
                }
            } else {
                processTradeResult();
            }
        }

        function processTradeResult() {
            const settings = getCurrentLeverageSettings();
            const bet = calculateBet();
            const win = tradeResult;
            
            // CALCOLA IL RISULTATO CON LE TASSE APPLICATE
            const result = calculateTradeResult(win, bet);
            
            totalTrades++;
            totalTradesElement.textContent = totalTrades;
            
            leverageUsed.push(settings.leverage);
            
            if (win) {
                wins++;
                currentStreak++;
                if (currentStreak > bestStreak) {
                    bestStreak = currentStreak;
                }
                
                const grossProfit = bet * settings.leverage;
                const tax = grossProfit * settings.tax;
                const netProfit = grossProfit - tax;
                totalWon += netProfit;
                
                statusMessage.textContent = `VITTORIA! +$${netProfit.toFixed(2)} netti (lordi: +$${grossProfit}, tassa: $${tax.toFixed(2)})`;
                statusMessage.style.color = "#0c0";
                chartColor = "#0c0";
                
                longBtn.classList.add('win-animation');
                setTimeout(() => longBtn.classList.remove('win-animation'), 1500);
            } else {
                losses++;
                currentStreak = 0;
                totalLost += bet;
                
                statusMessage.textContent = `PERDITA! -$${bet}`;
                statusMessage.style.color = "#f00";
                chartColor = "#f00";
                
                shortBtn.classList.add('loss-animation');
                setTimeout(() => shortBtn.classList.remove('loss-animation'), 1500);
            }
            
            balance += result;
            
            if (balance > bestBalance) {
                bestBalance = balance;
            }
            
            drawChart();
            
            saveGameState();
            updateBalanceDisplay();
            updateLeverageControls();
            updateBetInfo();
            updateUnlockInfo();
            updateStats();
            
            if (balance <= 0) {
                gameActive = false;
                gameOverScreen.style.display = 'flex';
                return;
            }
            
            setTimeout(startNewRound, 2000);
        }

        // ==================== CONTROLLI UI ====================
        function enableTradeButtons() {
            longBtn.disabled = false;
            shortBtn.disabled = false;
        }

        function disableTradeButtons() {
            longBtn.disabled = true;
            shortBtn.disabled = true;
        }

        function startNewRound() {
            chartStep = 0;
            userChoice = null;
            tradeResult = null;
            chartColor = "#fff";
            isAnimating = true;
            
            chartData = generateChartData(180);
            decisionPoint = Math.floor(chartData.length * (0.4 + Math.random() * 0.3));
            
            const settings = getCurrentLeverageSettings();
            statusMessage.textContent = `Analisi del mercato... (Leva ${settings.leverage}x - ${Math.round(settings.winChance * 100)}% win - Tassa ${(settings.tax * 100).toFixed(0)}%)`;
            statusMessage.style.color = "#888";
            disableTradeButtons();
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animateChart();
        }

        function chooseLong() {
            if (!isAnimating && gameActive && !userChoice) {
                userChoice = 'long';
                tradeResult = isTradeSuccessful();
                
                const trendStrength = tradeResult ? 0.08 : -0.08;
                const startValue = chartData[decisionPoint];
                const remainingLength = chartData.length - decisionPoint - 1;
                
                const newSegment = generateChartData(remainingLength, startValue, trendStrength);
                
                for (let i = 0; i < newSegment.length; i++) {
                    chartData[decisionPoint + 1 + i] = newSegment[i];
                }
                
                disableTradeButtons();
                statusMessage.textContent = "LONG selezionato";
                chartColor = "#fff";
                isAnimating = true;
                animationId = requestAnimationFrame(animateChart);
            }
        }

        function chooseShort() {
            if (!isAnimating && gameActive && !userChoice) {
                userChoice = 'short';
                tradeResult = isTradeSuccessful();
                
                const trendStrength = tradeResult ? -0.08 : 0.08;
                const startValue = chartData[decisionPoint];
                const remainingLength = chartData.length - decisionPoint - 1;
                
                const newSegment = generateChartData(remainingLength, startValue, trendStrength);
                
                for (let i = 0; i < newSegment.length; i++) {
                    chartData[decisionPoint + 1 + i] = newSegment[i];
                }
                
                disableTradeButtons();
                statusMessage.textContent = "SHORT selezionato";
                chartColor = "#fff";
                isAnimating = true;
                animationId = requestAnimationFrame(animateChart);
            }
        }

        function restartGame() {
            balance = 100;
            gameActive = true;
            leverageIndex = 0;
            leverage = 1;
            betPercentage = 10;
            totalTrades = 0;
            wins = 0;
            losses = 0;
            totalWon = 0;
            totalLost = 0;
            currentStreak = 0;
            leverageUsed = [];
            tradeResult = null;
            
            percentageSlider.value = betPercentage;
            percentageValue.textContent = `${betPercentage}%`;
            leverageSlider.value = leverageIndex;
            leverageValue.textContent = `${leverage}x`;
            
            gameOverScreen.style.display = 'none';
            
            updateBalanceDisplay();
            updateLeverageControls();
            updateBetInfo();
            updateUnlockInfo();
            updateStats();
            saveGameState();
            startNewRound();
        }

        // ==================== EVENT HANDLERS ====================
        function handlePercentageChange() {
            betPercentage = parseInt(percentageSlider.value);
            percentageValue.textContent = `${betPercentage}%`;
            updateBetInfo();
            saveGameState();
        }

        function handleLeverageChange() {
            leverageIndex = parseInt(leverageSlider.value);
            const settings = LEVERAGE_SETTINGS[leverageIndex];
            leverage = settings.leverage;
            leverageValue.textContent = `${leverage}x`;
            leverageValue.style.color = settings.color;
            
            updateBetInfo();
            updateStats();
            saveGameState();
        }

        // ==================== INIZIALIZZAZIONE ====================
        function initGame() {
            setupCanvas();
            loadGameState();
            
            // Event listeners
            longBtn.addEventListener('click', chooseLong);
            shortBtn.addEventListener('click', chooseShort);
            restartBtn.addEventListener('click', restartGame);
            percentageSlider.addEventListener('input', handlePercentageChange);
            leverageSlider.addEventListener('input', handleLeverageChange);
            
            window.addEventListener('resize', () => {
                setupCanvas();
                drawChart();
            });
            
            startNewRound();
        }

        window.addEventListener('load', initGame);
    </script>
</body>
</html>
