<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        
        .header span {
            font-weight: 300;
        }
        
        #chartCanvas {
            flex: 1;
            width: 100%;
            display: block;
        }
        
        .controls-container {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .leverage-controls {
            display: flex;
            gap: 30px;
        }
        
        .control {
            flex: 1;
        }
        
        .control label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #888;
            letter-spacing: 0.3px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 2px;
            background: #333;
            -webkit-appearance: none;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            min-width: 80px;
            font-size: 14px;
            text-align: right;
        }
        
        .trade-buttons {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        
        .trade-btn {
            flex: 1;
            height: 50px;
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        
        .trade-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .trade-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .long-btn {
            border-color: #0c0;
            color: #0c0;
        }
        
        .short-btn {
            border-color: #f00;
            color: #f00;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            height: 36px;
            color: #888;
            letter-spacing: 0.3px;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over h2 {
            font-size: 40px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .restart-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .bet-info {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            height: 40px;
            line-height: 1.4;
        }
        
        .risk-high { color: #ff4444; }
        .risk-medium { color: #ffaa00; }
        .risk-low { color: #44ff44; }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>Saldo: <span id="balance">100</span>$</div>
        <div>Record: <span id="bestBalance">100</span>$</div>
    </div>
    
    <canvas id="chartCanvas"></canvas>
    
    <div class="status" id="statusMessage">Analisi del mercato...</div>
    
    <div class="controls-container">
        <div class="leverage-controls">
            <div class="control">
                <label>PUNTATA (% del saldo)</label>
                <div class="slider-container">
                    <input type="range" min="1" max="100" value="10" id="percentageSlider">
                    <span class="slider-value" id="percentageValue">10%</span>
                </div>
            </div>
            <div class="control">
                <label>LEVA (rischio/rendimento)</label>
                <div class="slider-container">
                    <input type="range" min="0" max="7" value="0" id="leverageSlider">
                    <span class="slider-value" id="leverageValue">1x (80%)</span>
                </div>
            </div>
        </div>
        
        <div class="bet-info" id="betInfo">Puntata: 10$ | Se vinci: +10$ | Se perdi: -10$ (80% win)</div>
        
        <div class="trade-buttons">
            <button id="longBtn" class="trade-btn long-btn" disabled>▲ LONG</button>
            <button id="shortBtn" class="trade-btn short-btn" disabled>▼ SHORT</button>
        </div>
    </div>
    
    <div class="game-over" id="gameOverScreen">
        <h2>GAME OVER</h2>
        <button id="restartBtn" class="restart-btn">RIPRENDI</button>
    </div>

    <script>
        // ===== SISTEMA DI LEVA CON PROBABILITÀ =====
        const LEVERAGE_LEVELS = [
            { leverage: 1, winProbability: 0.8, unlockThreshold: 100, color: "#44ff44" },    // 80% win
            { leverage: 2, winProbability: 0.7, unlockThreshold: 150, color: "#88ff44" },    // 70% win
            { leverage: 3, winProbability: 0.6, unlockThreshold: 200, color: "#ccff44" },    // 60% win
            { leverage: 5, winProbability: 0.5, unlockThreshold: 300, color: "#ffcc44" },    // 50% win
            { leverage: 10, winProbability: 0.4, unlockThreshold: 500, color: "#ff8844" },   // 40% win
            { leverage: 20, winProbability: 0.3, unlockThreshold: 800, color: "#ff4444" },   // 30% win
            { leverage: 50, winProbability: 0.2, unlockThreshold: 1500, color: "#ff4488" },  // 20% win
            { leverage: 100, winProbability: 0.1, unlockThreshold: 3000, color: "#ff44cc" }  // 10% win
        ];

        // ===== VARIABILI GLOBALI =====
        let balance = 100;
        let bestBalance = 100;
        let chartData = [];
        let chartStep = 0;
        let gameActive = true;
        let isAnimating = true;
        let animationId = null;
        let decisionPoint = 0;
        let userChoice = null;
        let chartColor = "#fff";
        
        // Variabili per le leve
        let betPercentage = 10;
        let currentLeverageIndex = 0;
        let unlockedLeverageLevels = [];
        
        // Elementi DOM
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d', { antialias: false });
        ctx.imageSmoothingEnabled = false;
        
        const balanceElement = document.getElementById('balance');
        const bestBalanceElement = document.getElementById('bestBalance');
        const longBtn = document.getElementById('longBtn');
        const shortBtn = document.getElementById('shortBtn');
        const statusMessage = document.getElementById('statusMessage');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');
        const percentageSlider = document.getElementById('percentageSlider');
        const percentageValue = document.getElementById('percentageValue');
        const leverageSlider = document.getElementById('leverageSlider');
        const leverageValue = document.getElementById('leverageValue');
        const betInfo = document.getElementById('betInfo');
        
        // ===== INIZIALIZZAZIONE =====
        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
        }
        
        // Carica stato del gioco
        function loadGameState() {
            const savedBalance = localStorage.getItem('tradingBalance');
            const savedBestBalance = localStorage.getItem('tradingBestBalance');
            const savedPercentage = localStorage.getItem('tradingPercentage');
            const savedLeverageIndex = localStorage.getItem('tradingLeverageIndex');
            
            if (savedBalance) balance = parseInt(savedBalance);
            if (savedBestBalance) bestBalance = parseInt(savedBestBalance);
            if (savedPercentage) {
                betPercentage = parseInt(savedPercentage);
                percentageSlider.value = betPercentage;
                percentageValue.textContent = `${betPercentage}%`;
            }
            if (savedLeverageIndex) {
                currentLeverageIndex = Math.min(7, parseInt(savedLeverageIndex));
            }
            
            updateUnlockedLeverageLevels();
            updateBalanceDisplay();
            updateBetInfo();
        }
        
        // Salva stato del gioco
        function saveGameState() {
            localStorage.setItem('tradingBalance', balance.toString());
            localStorage.setItem('tradingBestBalance', bestBalance.toString());
            localStorage.setItem('tradingPercentage', betPercentage.toString());
            localStorage.setItem('tradingLeverageIndex', currentLeverageIndex.toString());
        }
        
        // Aggiorna display saldo
        function updateBalanceDisplay() {
            balanceElement.textContent = balance;
            bestBalanceElement.textContent = bestBalance;
            updateUnlockedLeverageLevels();
            updateLeverageControls();
        }
        
        // Calcola puntata attuale
        function calculateBet() {
            return Math.floor(balance * (betPercentage / 100));
        }
        
        // Aggiorna le leve sbloccate in base al saldo
        function updateUnlockedLeverageLevels() {
            unlockedLeverageLevels = LEVERAGE_LEVELS.filter(level => balance >= level.unlockThreshold);
            
            // Se l'indice corrente non è valido, ridimensionalo
            if (currentLeverageIndex >= unlockedLeverageLevels.length) {
                currentLeverageIndex = Math.max(0, unlockedLeverageLevels.length - 1);
            }
        }
        
        // Aggiorna controlli della leva
        function updateLeverageControls() {
            if (unlockedLeverageLevels.length === 0) return;
            
            leverageSlider.max = unlockedLeverageLevels.length - 1;
            leverageSlider.disabled = unlockedLeverageLevels.length <= 1;
            
            const currentLevel = unlockedLeverageLevels[currentLeverageIndex];
            leverageValue.textContent = `${currentLevel.leverage}x (${Math.round(currentLevel.winProbability * 100)}%)`;
            leverageValue.style.color = currentLevel.color;
            
            // Mostra il prossimo sblocco
            showNextUnlockInfo();
        }
        
        // Mostra informazioni sul prossimo sblocco
        function showNextUnlockInfo() {
            const currentMaxLeverage = unlockedLeverageLevels[unlockedLeverageLevels.length - 1].leverage;
            
            for (let i = 0; i < LEVERAGE_LEVELS.length; i++) {
                if (LEVERAGE_LEVELS[i].leverage > currentMaxLeverage) {
                    const nextLevel = LEVERAGE_LEVELS[i];
                    const remaining = nextLevel.unlockThreshold - balance;
                    
                    if (remaining > 0) {
                        statusMessage.innerHTML = `Prossimo sblocco: Leva ${nextLevel.leverage}x (${Math.round(nextLevel.winProbability * 100)}% win) a $${nextLevel.unlockThreshold} <span style="color:#888">(+$${remaining})</span>`;
                    }
                    return;
                }
            }
        }
        
        // Aggiorna info puntata
        function updateBetInfo() {
            if (unlockedLeverageLevels.length === 0) return;
            
            const currentLevel = unlockedLeverageLevels[currentLeverageIndex];
            const bet = calculateBet();
            const potentialWin = bet * currentLevel.leverage;
            const potentialLoss = bet;
            const winPercentage = Math.round(currentLevel.winProbability * 100);
            
            betInfo.innerHTML = `
                Puntata: <strong>${bet}$</strong> (${betPercentage}% del saldo)<br>
                Se vinci: <span style="color:#0c0">+${potentialWin}$</span> | 
                Se perdi: <span style="color:#f00">-${potentialLoss}$</span> | 
                Probabilità: ${winPercentage}%
            `;
            
            // Colore in base al rischio
            if (winPercentage <= 20) {
                betInfo.className = "bet-info risk-high";
            } else if (winPercentage <= 50) {
                betInfo.className = "bet-info risk-medium";
            } else {
                betInfo.className = "bet-info risk-low";
            }
        }
        
        // ===== GRAFICO =====
        function generateChartData() {
            const dataLength = 180;
            const data = [];
            
            let value = 50;
            const trend = (Math.random() - 0.5) * 0.1;
            
            for (let i = 0; i < dataLength; i++) {
                value += (Math.random() - 0.5) * 1.5 + trend;
                
                if (value < 5) value = 5 + Math.random() * 5;
                if (value > 95) value = 95 - Math.random() * 5;
                
                data.push(value);
            }
            
            return data;
        }
        
        // Disegna grafico HD
        function drawChart() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (chartData.length === 0) return;
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            
            const minValue = Math.min(...chartData);
            const maxValue = Math.max(...chartData);
            const valueRange = maxValue - minValue || 1;
            
            const scaleY = height / valueRange;
            const stepX = width / (chartData.length - 1);
            
            ctx.strokeStyle = chartColor;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            for (let i = 0; i < Math.min(chartStep, chartData.length); i++) {
                const x = i * stepX;
                const y = height - ((chartData[i] - minValue) * scaleY);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            
            // Punto decisionale
            if (userChoice && decisionPoint > 0 && chartStep > decisionPoint) {
                const decisionX = decisionPoint * stepX;
                const decisionY = height - ((chartData[decisionPoint] - minValue) * scaleY);
                
                ctx.fillStyle = chartColor;
                ctx.beginPath();
                ctx.arc(decisionX, decisionY, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Animazione grafico
        function animateChart() {
            if (chartStep < chartData.length) {
                chartStep++;
                drawChart();
                
                if (isAnimating && chartStep <= decisionPoint) {
                    setTimeout(() => {
                        animationId = requestAnimationFrame(animateChart);
                    }, 8 + Math.random() * 4);
                } 
                else if (userChoice && chartStep > decisionPoint) {
                    setTimeout(() => {
                        animationId = requestAnimationFrame(animateChart);
                    }, 20);
                } 
                else if (chartStep > decisionPoint && !userChoice) {
                    isAnimating = false;
                    enableTradeButtons();
                    statusMessage.textContent = "Previsione?";
                    return;
                }
                else {
                    animationId = requestAnimationFrame(animateChart);
                }
            } else {
                if (userChoice) {
                    // Risultato già processato in handleTradeChoice
                    if (balance <= 0) {
                        gameActive = false;
                        gameOverScreen.style.display = 'flex';
                        return;
                    }
                    
                    setTimeout(startNewRound, 2000);
                }
            }
        }
        
        // ===== LOGICA DI TRADING =====
        function enableTradeButtons() {
            longBtn.disabled = false;
            shortBtn.disabled = false;
        }
        
        function disableTradeButtons() {
            longBtn.disabled = true;
            shortBtn.disabled = true;
        }
        
        // Nuovo round
        function startNewRound() {
            chartStep = 0;
            userChoice = null;
            chartColor = "#fff";
            isAnimating = true;
            
            chartData = generateChartData();
            decisionPoint = Math.floor(chartData.length * (0.4 + Math.random() * 0.3));
            
            statusMessage.textContent = "Analisi del mercato...";
            disableTradeButtons();
            
            // Mostra info sul prossimo sblocco se non c'è scelta utente
            if (isAnimating && !userChoice) {
                showNextUnlockInfo();
            }
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animateChart();
        }
        
        // Gestisce la scelta di trading (LONG o SHORT)
        function handleTradeChoice(direction) {
            if (!isAnimating || userChoice !== null) return;
            
            userChoice = direction;
            disableTradeButtons();
            
            // Determina se vince in base alla probabilità della leva
            const currentLevel = unlockedLeverageLevels[currentLeverageIndex];
            const win = Math.random() < currentLevel.winProbability;
            
            // Calcola risultato
            const bet = calculateBet();
            let result;
            
            if (win) {
                result = bet * currentLevel.leverage;
                balance += result;
                statusMessage.textContent = `VINTO! +${result}$ (${currentLevel.leverage}x)`;
                chartColor = "#0c0";
                
                // Animazione pulsanti vittoria
                if (direction === 'long') {
                    longBtn.style.animation = "pulse-red 0.5s 3";
                } else {
                    shortBtn.style.animation = "pulse-red 0.5s 3";
                }
            } else {
                result = -bet;
                balance += result;
                statusMessage.textContent = `PERSO! ${result}$`;
                chartColor = "#f00";
            }
            
            // Aggiorna display e salva
            if (balance > bestBalance) {
                bestBalance = balance;
            }
            
            saveGameState();
            updateBalanceDisplay();
            updateBetInfo();
            
            // Continua animazione per mostrare risultato
            isAnimating = true;
            animationId = requestAnimationFrame(animateChart);
        }
        
        // Riavvia gioco
        function restartGame() {
            balance = 100;
            betPercentage = 10;
            currentLeverageIndex = 0;
            gameActive = true;
            
            percentageSlider.value = betPercentage;
            percentageValue.textContent = `${betPercentage}%`;
            
            gameOverScreen.style.display = 'none';
            updateBalanceDisplay();
            updateBetInfo();
            saveGameState();
            startNewRound();
        }
        
        // ===== GESTIONE EVENTI =====
        function handlePercentageChange() {
            betPercentage = parseInt(percentageSlider.value);
            percentageValue.textContent = `${betPercentage}%`;
            updateBetInfo();
            saveGameState();
        }
        
        function handleLeverageChange() {
            currentLeverageIndex = parseInt(leverageSlider.value);
            
            // Assicurati che l'indice sia valido
            if (currentLeverageIndex >= unlockedLeverageLevels.length) {
                currentLeverageIndex = unlockedLeverageLevels.length - 1;
            }
            
            updateLeverageControls();
            updateBetInfo();
            saveGameState();
            
            // Mostra warning per leve rischiose
            const currentLevel = unlockedLeverageLevels[currentLeverageIndex];
            if (currentLevel.winProbability <= 0.3) {
                const winChance = Math.round(currentLevel.winProbability * 100);
                statusMessage.textContent = `⚠️ Attenzione! Solo ${winChance}% di probabilità di vincita`;
                statusMessage.style.color = "#ff4444";
            }
        }
        
        // ===== INIZIALIZZAZIONE GIOCO =====
        function initGame() {
            setupCanvas();
            loadGameState();
            
            longBtn.addEventListener('click', () => handleTradeChoice('long'));
            shortBtn.addEventListener('click', () => handleTradeChoice('short'));
            restartBtn.addEventListener('click', restartGame);
            percentageSlider.addEventListener('input', handlePercentageChange);
            leverageSlider.addEventListener('input', handleLeverageChange);
            
            window.addEventListener('resize', () => {
                setupCanvas();
                drawChart();
            });
            
            startNewRound();
        }
        
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
