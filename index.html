<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        
        .header span {
            font-weight: 300;
        }
        
        #chartCanvas {
            flex: 1;
            width: 100%;
            display: block;
        }
        
        .controls-container {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .leverage-controls {
            display: flex;
            gap: 30px;
        }
        
        .control {
            flex: 1;
        }
        
        .control label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #888;
            letter-spacing: 0.3px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            flex: 1;
            height: 2px;
            background: #333;
            -webkit-appearance: none;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            min-width: 40px;
            font-size: 14px;
            text-align: right;
        }
        
        .trade-buttons {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        
        .trade-btn {
            flex: 1;
            height: 50px;
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        
        .trade-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .trade-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .long-btn {
            border-color: #0c0;
            color: #0c0;
        }
        
        .short-btn {
            border-color: #f00;
            color: #f00;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            height: 36px;
            color: #888;
            letter-spacing: 0.3px;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .game-over h2 {
            font-size: 40px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .restart-btn {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .bet-info {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>Saldo: <span id="balance">100</span>$</div>
        <div>Record: <span id="bestBalance">100</span>$</div>
    </div>
    
    <canvas id="chartCanvas"></canvas>
    
    <div class="status" id="statusMessage">Analisi del mercato...</div>
    
    <div class="controls-container">
        <div class="leverage-controls">
            <div class="control">
                <label>PUNTATA</label>
                <div class="slider-container">
                    <input type="range" min="1" max="100" value="10" id="percentageSlider">
                    <span class="slider-value" id="percentageValue">10%</span>
                </div>
            </div>
            <div class="control">
                <label>LEVA</label>
                <div class="slider-container">
                    <input type="range" min="1" max="10" value="1" id="leverageSlider">
                    <span class="slider-value" id="leverageValue">1x</span>
                </div>
            </div>
        </div>
        
        <div class="bet-info" id="betInfo">Puntata: 10$ | Potenziale: 10$</div>
        
        <div class="trade-buttons">
            <button id="longBtn" class="trade-btn long-btn" disabled>▲ LONG</button>
            <button id="shortBtn" class="trade-btn short-btn" disabled>▼ SHORT</button>
        </div>
    </div>
    
    <div class="game-over" id="gameOverScreen">
        <h2>GAME OVER</h2>
        <button id="restartBtn" class="restart-btn">RIPRENDI</button>
    </div>

    <script>
        // Inizializzazione
        let balance = 100;
        let bestBalance = 100;
        let chartData = [];
        let chartStep = 0;
        let gameActive = true;
        let isAnimating = true;
        let animationId = null;
        let decisionPoint = 0;
        let userChoice = null;
        let chartColor = "#fff";
        
        // Variabili per le leve
        let betPercentage = 10;
        let leverage = 1;
        
        // Elementi DOM
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d', { antialias: false });
        ctx.imageSmoothingEnabled = false;
        
        const balanceElement = document.getElementById('balance');
        const bestBalanceElement = document.getElementById('bestBalance');
        const longBtn = document.getElementById('longBtn');
        const shortBtn = document.getElementById('shortBtn');
        const statusMessage = document.getElementById('statusMessage');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');
        const percentageSlider = document.getElementById('percentageSlider');
        const percentageValue = document.getElementById('percentageValue');
        const leverageSlider = document.getElementById('leverageSlider');
        const leverageValue = document.getElementById('leverageValue');
        const betInfo = document.getElementById('betInfo');
        
        // Setup canvas
        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
        }
        
        // Carica stato
        function loadGameState() {
            const savedBalance = localStorage.getItem('tradingBalance');
            const savedBestBalance = localStorage.getItem('tradingBestBalance');
            const savedPercentage = localStorage.getItem('tradingPercentage');
            const savedLeverage = localStorage.getItem('tradingLeverage');
            
            if (savedBalance) balance = parseInt(savedBalance);
            if (savedBestBalance) bestBalance = parseInt(savedBestBalance);
            if (savedPercentage) {
                betPercentage = parseInt(savedPercentage);
                percentageSlider.value = betPercentage;
                percentageValue.textContent = `${betPercentage}%`;
            }
            if (savedLeverage) {
                leverage = parseInt(savedLeverage);
                leverageSlider.value = leverage;
                leverageValue.textContent = `${leverage}x`;
            }
            
            updateBalanceDisplay();
            updateBetInfo();
        }
        
        // Salva stato
        function saveGameState() {
            localStorage.setItem('tradingBalance', balance.toString());
            localStorage.setItem('tradingBestBalance', bestBalance.toString());
            localStorage.setItem('tradingPercentage', betPercentage.toString());
            localStorage.setItem('tradingLeverage', leverage.toString());
        }
        
        // Aggiorna display saldo
        function updateBalanceDisplay() {
            balanceElement.textContent = balance;
            bestBalanceElement.textContent = bestBalance;
        }
        
        // Calcola puntata
        function calculateBet() {
            return Math.floor(balance * (betPercentage / 100));
        }
        
        // Aggiorna info puntata
        function updateBetInfo() {
            const bet = calculateBet();
            const potential = bet * leverage;
            betInfo.textContent = `Puntata: ${bet}$ | Potenziale: ${potential}$`;
        }
        
        // Genera dati grafico (random walk)
        function generateChartData() {
            const dataLength = 180;
            const data = [];
            
            let value = 50;
            const trend = (Math.random() - 0.5) * 0.1;
            
            for (let i = 0; i < dataLength; i++) {
                value += (Math.random() - 0.5) * 1.5 + trend;
                
                if (value < 5) value = 5 + Math.random() * 5;
                if (value > 95) value = 95 - Math.random() * 5;
                
                data.push(value);
            }
            
            return data;
        }
        
        // Disegna grafico HD senza margini
        function drawChart() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (chartData.length === 0) return;
            
            // Reset context per HD
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            const dpr = window.devicePixelRatio || 1;
            ctx.scale(dpr, dpr);
            
            // Calcola scale (senza margini)
            const minValue = Math.min(...chartData);
            const maxValue = Math.max(...chartData);
            const valueRange = maxValue - minValue || 1;
            
            const scaleY = height / valueRange;
            const stepX = width / (chartData.length - 1);
            
            // Disegna linea HD
            ctx.strokeStyle = chartColor;
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            for (let i = 0; i < Math.min(chartStep, chartData.length); i++) {
                const x = i * stepX;
                const y = height - ((chartData[i] - minValue) * scaleY);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke();
            
            // Punto decisionale
            if (userChoice && decisionPoint > 0 && chartStep > decisionPoint) {
                const decisionX = decisionPoint * stepX;
                const decisionY = height - ((chartData[decisionPoint] - minValue) * scaleY);
                
                ctx.fillStyle = chartColor;
                ctx.beginPath();
                ctx.arc(decisionX, decisionY, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Animazione grafico
        function animateChart() {
            if (chartStep < chartData.length) {
                chartStep++;
                drawChart();
                
                if (isAnimating && chartStep <= decisionPoint) {
                    setTimeout(() => {
                        animationId = requestAnimationFrame(animateChart);
                    }, 8 + Math.random() * 4);
                } 
                else if (userChoice && chartStep > decisionPoint) {
                    setTimeout(() => {
                        animationId = requestAnimationFrame(animateChart);
                    }, 20);
                } 
                else if (chartStep > decisionPoint && !userChoice) {
                    isAnimating = false;
                    enableTradeButtons();
                    statusMessage.textContent = "Previsione?";
                    return;
                }
                else {
                    animationId = requestAnimationFrame(animateChart);
                }
            } else {
                if (userChoice) {
                    const startPrice = chartData[decisionPoint];
                    const endPrice = chartData[chartData.length - 1];
                    const isCorrect = (userChoice === 'long' && endPrice > startPrice) || 
                                     (userChoice === 'short' && endPrice < startPrice);
                    
                    const bet = calculateBet();
                    const result = bet * leverage;
                    
                    if (isCorrect) {
                        balance += result;
                        statusMessage.textContent = `+${result}$`;
                        chartColor = "#0c0";
                    } else {
                        balance -= result;
                        statusMessage.textContent = `-${result}$`;
                        chartColor = "#f00";
                    }
                    
                    drawChart();
                    
                    if (balance > bestBalance) {
                        bestBalance = balance;
                    }
                    
                    saveGameState();
                    updateBalanceDisplay();
                    updateBetInfo();
                    
                    if (balance <= 0) {
                        gameActive = false;
                        gameOverScreen.style.display = 'flex';
                        return;
                    }
                    
                    setTimeout(startNewRound, 2000);
                }
            }
        }
        
        // Abilita/disabilita pulsanti
        function enableTradeButtons() {
            longBtn.disabled = false;
            shortBtn.disabled = false;
        }
        
        function disableTradeButtons() {
            longBtn.disabled = true;
            shortBtn.disabled = true;
        }
        
        // Nuovo round
        function startNewRound() {
            chartStep = 0;
            userChoice = null;
            chartColor = "#fff";
            isAnimating = true;
            
            chartData = generateChartData();
            decisionPoint = Math.floor(chartData.length * (0.4 + Math.random() * 0.3));
            
            statusMessage.textContent = "Analisi del mercato...";
            disableTradeButtons();
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            animateChart();
        }
        
        // Scelte trading
        function chooseLong() {
            if (!isAnimating && gameActive && !userChoice) {
                userChoice = 'long';
                disableTradeButtons();
                statusMessage.textContent = "LONG selezionato";
                chartColor = "#fff";
                animationId = requestAnimationFrame(animateChart);
            }
        }
        
        function chooseShort() {
            if (!isAnimating && gameActive && !userChoice) {
                userChoice = 'short';
                disableTradeButtons();
                statusMessage.textContent = "SHORT selezionato";
                chartColor = "#fff";
                animationId = requestAnimationFrame(animateChart);
            }
        }
        
        // Riavvia gioco
        function restartGame() {
            balance = 100;
            gameActive = true;
            gameOverScreen.style.display = 'none';
            updateBalanceDisplay();
            updateBetInfo();
            saveGameState();
            startNewRound();
        }
        
        // Gestione leve
        function handlePercentageChange() {
            betPercentage = parseInt(percentageSlider.value);
            percentageValue.textContent = `${betPercentage}%`;
            updateBetInfo();
            saveGameState();
        }
        
        function handleLeverageChange() {
            leverage = parseInt(leverageSlider.value);
            leverageValue.textContent = `${leverage}x`;
            updateBetInfo();
            saveGameState();
        }
        
        // Inizializzazione
        function initGame() {
            setupCanvas();
            loadGameState();
            
            longBtn.addEventListener('click', chooseLong);
            shortBtn.addEventListener('click', chooseShort);
            restartBtn.addEventListener('click', restartGame);
            percentageSlider.addEventListener('input', handlePercentageChange);
            leverageSlider.addEventListener('input', handleLeverageChange);
            
            window.addEventListener('resize', () => {
                setupCanvas();
                drawChart();
            });
            
            startNewRound();
        }
        
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
