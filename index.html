<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>XTRADE - Bitcoin Real Time</title>
    <style>
        /* ... (mantieni tutto il CSS originale) ... */
    </style>
</head>
<body>
    <!-- ... (mantieni tutto l'HTML originale) ... -->

    <script>
        // ==================== CONFIGURATION ====================
        const CONFIG = {
            LEVERAGES: [
                { value: 1, baseWin: 0.80, color: "#00ff88", name: "Novice" },
                { value: 2, baseWin: 0.70, color: "#66ffaa", name: "Beginner" },
                { value: 3, baseWin: 0.60, color: "#99ffcc", name: "Intermediate" },
                { value: 5, baseWin: 0.50, color: "#ffff44", name: "Expert" },
                { value: 10, baseWin: 0.40, color: "#ffaa44", name: "Risky" },
                { value: 20, baseWin: 0.30, color: "#ff7744", name: "High Risk" },
                { value: 50, baseWin: 0.20, color: "#ff4444", name: "Extreme" },
                { value: 100, baseWin: 0.20, color: "#ff2244", name: "Insane" }
            ],
            
            UNLOCKS: [
                { threshold: 1000, maxIndex: 0 },
                { threshold: 1500, maxIndex: 1 },
                { threshold: 2500, maxIndex: 2 },
                { threshold: 5000, maxIndex: 3 },
                { threshold: 10000, maxIndex: 4 },
                { threshold: 25000, maxIndex: 5 },
                { threshold: 50000, maxIndex: 6 },
                { threshold: 100000, maxIndex: 7 }
            ],
            
            INITIAL_BALANCE: 10000,
            MIN_BALANCE: 1000,
            TRADE_DURATION: 3000, // 3 secondi per il trade
            BTC_API_URL: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true"
        };

        // ==================== STATE ====================
        let state = {
            balance: CONFIG.INITIAL_BALANCE,
            bestBalance: CONFIG.INITIAL_BALANCE,
            totalTrades: 0,
            wins: 0,
            gameActive: true,
            isAnimating: false,
            
            // Dati per il grafico Bitcoin in tempo reale
            btcPriceHistory: [],
            currentBtcPrice: 0,
            btcPriceChange: 0,
            lastBtcUpdate: Date.now(),
            btcUpdateInterval: 2000, // Aggiorna ogni 2 secondi
            
            // Stato del trade
            tradeActive: false,
            tradeStartTime: 0,
            tradeEndTime: 0,
            tradeStartPrice: 0,
            tradeEndPrice: 0,
            tradeDirection: null, // 'long' o 'short'
            tradeResult: null, // true = vinto, false = perso
            
            leverageIndex: 0,
            betPercentage: 5,
            
            lastBalance: CONFIG.INITIAL_BALANCE,
            
            leverageStats: {},
            
            soundEnabled: true,
            hapticEnabled: true,
            username: "Trader",
            currentPage: 'trading'
        };

        // ==================== BITCOIN REAL-TIME FUNCTIONS ====================
        async function fetchBitcoinPrice() {
            try {
                const response = await fetch(CONFIG.BTC_API_URL);
                const data = await response.json();
                const price = data.bitcoin.usd;
                const change = data.bitcoin.usd_24h_change || 0;
                
                return { price, change };
            } catch (error) {
                console.error("Errore nel fetch del prezzo Bitcoin:", error);
                // Fallback a un prezzo simulato se l'API non funziona
                const simulatedPrice = 50000 + (Math.random() - 0.5) * 1000;
                const simulatedChange = (Math.random() - 0.5) * 5;
                return { price: simulatedPrice, change: simulatedChange };
            }
        }

        function updateBitcoinPrice() {
            if (state.currentPage !== 'trading') return;
            
            fetchBitcoinPrice().then(({ price, change }) => {
                state.currentBtcPrice = price;
                state.btcPriceChange = change;
                
                // Aggiungi il prezzo alla storia per il grafico
                state.btcPriceHistory.push({
                    time: Date.now(),
                    price: price,
                    change: change
                });
                
                // Mantieni solo gli ultimi 50 punti
                if (state.btcPriceHistory.length > 50) {
                    state.btcPriceHistory = state.btcPriceHistory.slice(-50);
                }
                
                // Aggiorna il grafico
                updateBtcChart();
                
                // Aggiorna il badge del prezzo
                updateBtcPriceBadge();
                
                // Se c'è un trade attivo, aggiorna il countdown
                if (state.tradeActive) {
                    updateTradeCountdown();
                }
            });
        }

        function updateBtcPriceBadge() {
            const badge = document.getElementById('btcPriceBadge');
            if (!badge) return;
            
            const changeText = state.btcPriceChange >= 0 ? 
                `+${state.btcPriceChange.toFixed(2)}%` : 
                `${state.btcPriceChange.toFixed(2)}%`;
            
            badge.innerHTML = `BTC $${state.currentBtcPrice.toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            })} <span style="color: ${state.btcPriceChange >= 0 ? '#00ff88' : '#ff4444'}">${changeText}</span>`;
        }

        function updateTradeCountdown() {
            const now = Date.now();
            const elapsed = now - state.tradeStartTime;
            const remaining = Math.max(0, CONFIG.TRADE_DURATION - elapsed);
            
            const countdownElement = document.getElementById('tradeCountdown');
            if (countdownElement) {
                const secondsRemaining = (remaining / 1000).toFixed(1);
                countdownElement.textContent = `${secondsRemaining}s`;
                countdownElement.style.color = remaining > 1000 ? '#00ff88' : '#ff4444';
            }
            
            // Se il tempo è scaduto, completa il trade
            if (remaining <= 0 && !state.tradeResult) {
                completeBtcTrade();
            }
        }

        function updateBtcChart() {
            if (!dom.chartCtx || state.btcPriceHistory.length < 2) return;
            
            const ctx = dom.chartCtx;
            const width = dom.chartCanvas.width / (window.devicePixelRatio || 1);
            const height = dom.chartCanvas.height / (window.devicePixelRatio || 1);
            
            // Clear canvas
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0a0a0a');
            gradient.addColorStop(1, '#050505');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Calcola il range dei prezzi
            const prices = state.btcPriceHistory.map(p => p.price);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);
            const priceRange = maxPrice - minPrice;
            const padding = priceRange * 0.1;
            const chartMin = minPrice - padding;
            const chartMax = maxPrice + padding;
            const chartRange = chartMax - chartMin;
            
            // Disegna il grafico a linee
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = state.btcPriceChange >= 0 ? '#00ff88' : '#ff4444';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            state.btcPriceHistory.forEach((point, index) => {
                const x = (index / (state.btcPriceHistory.length - 1)) * width * 0.9 + width * 0.05;
                const y = height - ((point.price - chartMin) / chartRange * height);
                
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            
            ctx.stroke();
            
            // Aggiungi un gradiente sotto la linea
            ctx.lineTo(width * 0.95, height);
            ctx.lineTo(width * 0.05, height);
            ctx.closePath();
            
            const areaGradient = ctx.createLinearGradient(0, 0, 0, height);
            areaGradient.addColorStop(0, state.btcPriceChange >= 0 ? 
                'rgba(0, 255, 136, 0.2)' : 'rgba(255, 68, 68, 0.2)');
            areaGradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = areaGradient;
            ctx.fill();
            
            // Disegna il punto dell'ultimo prezzo
            if (state.btcPriceHistory.length > 0) {
                const lastPoint = state.btcPriceHistory[state.btcPriceHistory.length - 1];
                const lastX = width * 0.95;
                const lastY = height - ((lastPoint.price - chartMin) / chartRange * height);
                
                ctx.beginPath();
                ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
                ctx.fillStyle = state.btcPriceChange >= 0 ? '#00ff88' : '#ff4444';
                ctx.fill();
                
                // Effetto glow
                ctx.beginPath();
                ctx.arc(lastX, lastY, 8, 0, Math.PI * 2);
                ctx.fillStyle = state.btcPriceChange >= 0 ? 
                    'rgba(0, 255, 136, 0.3)' : 'rgba(255, 68, 68, 0.3)';
                ctx.fill();
            }
            
            // Se c'è un trade attivo, mostra la linea del prezzo di partenza
            if (state.tradeActive && state.tradeStartPrice > 0) {
                const startY = height - ((state.tradeStartPrice - chartMin) / chartRange * height);
                
                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = state.tradeDirection === 'long' ? '#00ff88' : '#ff4444';
                ctx.lineWidth = 1;
                ctx.moveTo(width * 0.05, startY);
                ctx.lineTo(width * 0.95, startY);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Testo del prezzo di partenza
                ctx.fillStyle = state.tradeDirection === 'long' ? '#00ff88' : '#ff4444';
                ctx.font = '12px Arial';
                ctx.fillText(
                    `Start: $${state.tradeStartPrice.toLocaleString('en-US', {maximumFractionDigits: 0})}`,
                    width * 0.05,
                    startY - 10
                );
            }
        }

        // ==================== TRADE FUNCTIONS ====================
        async function startBtcTrade(direction) {
            if (!state.gameActive || state.tradeActive || state.isAnimating) return;
            
            // Disabilita i bottoni
            dom.longBtn.disabled = true;
            dom.shortBtn.disabled = true;
            state.isAnimating = true;
            
            // Ottieni il prezzo corrente
            const priceData = await fetchBitcoinPrice();
            state.currentBtcPrice = priceData.price;
            
            // Inizia il trade
            state.tradeActive = true;
            state.tradeStartTime = Date.now();
            state.tradeEndTime = state.tradeStartTime + CONFIG.TRADE_DURATION;
            state.tradeStartPrice = state.currentBtcPrice;
            state.tradeDirection = direction;
            state.tradeResult = null;
            
            // Mostra il countdown
            const chartOverlay = document.querySelector('.chart-overlay');
            if (!chartOverlay.querySelector('#tradeCountdown')) {
                const countdownBadge = document.createElement('div');
                countdownBadge.className = 'chart-badge';
                countdownBadge.id = 'tradeCountdown';
                countdownBadge.style.color = '#00ff88';
                chartOverlay.appendChild(countdownBadge);
            }
            
            // Aggiorna UI
            updateTradeUI();
            
            // Avvia il timer per completare il trade
            setTimeout(() => {
                if (state.tradeActive) {
                    completeBtcTrade();
                }
            }, CONFIG.TRADE_DURATION);
        }

        async function completeBtcTrade() {
            if (!state.tradeActive) return;
            
            // Ottieni il prezzo finale
            const priceData = await fetchBitcoinPrice();
            const finalPrice = priceData.price;
            state.tradeEndPrice = finalPrice;
            
            // Determina se il trade ha vinto
            let isWin = false;
            if (state.tradeDirection === 'long') {
                isWin = finalPrice > state.tradeStartPrice;
            } else { // short
                isWin = finalPrice < state.tradeStartPrice;
            }
            
            // Applica la probabilità dinamica (come nel sistema originale)
            const shouldWin = Math.random() < calculateWinProbability();
            const finalResult = isWin && shouldWin;
            
            state.tradeResult = finalResult;
            
            // Calcola il risultato finanziario
            const betAmount = calculateBetAmount();
            const leverage = CONFIG.LEVERAGES[state.leverageIndex].value;
            const result = finalResult ? betAmount * leverage : -betAmount * leverage;
            
            // Aggiorna lo stato
            state.balance += result;
            state.totalTrades++;
            state.leverageStats[leverage].total++;
            
            if (finalResult) {
                state.wins++;
                state.leverageStats[leverage].wins++;
                if (state.soundEnabled) playSound('win');
            } else {
                if (state.soundEnabled) playSound('lose');
            }
            
            if (state.balance > state.bestBalance) {
                state.bestBalance = state.balance;
            }
            
            // Controlla bancarotta
            if (state.balance <= 0) {
                state.gameActive = false;
                dom.gameOverScreen.style.display = 'flex';
                if (state.soundEnabled) playSound('bankruptcy');
            }
            
            // Mostra il risultato
            showTradeResult(finalResult, finalPrice);
            
            // Salva e aggiorna UI
            saveGameState();
            updateUI();
            
            // Resetta per il prossimo trade
            setTimeout(() => {
                resetTradeState();
                state.isAnimating = false;
                dom.longBtn.disabled = false;
                dom.shortBtn.disabled = false;
                updateTradeUI();
            }, 3000);
        }

        function showTradeResult(isWin, finalPrice) {
            // Rimuovi il countdown
            const countdownElement = document.getElementById('tradeCountdown');
            if (countdownElement) {
                countdownElement.textContent = isWin ? 'WIN!' : 'LOSE!';
                countdownElement.style.color = isWin ? '#00ff88' : '#ff4444';
                countdownElement.style.animation = 'pulse 0.5s infinite alternate';
            }
            
            // Mostra il risultato nel grafico
            const chartOverlay = document.querySelector('.chart-overlay');
            if (!chartOverlay.querySelector('#tradeResult')) {
                const resultBadge = document.createElement('div');
                resultBadge.className = 'chart-badge';
                resultBadge.id = 'tradeResult';
                resultBadge.style.backgroundColor = isWin ? 
                    'rgba(0, 255, 136, 0.2)' : 'rgba(255, 68, 68, 0.2)';
                resultBadge.style.borderColor = isWin ? 
                    'rgba(0, 255, 136, 0.5)' : 'rgba(255, 68, 68, 0.5)';
                chartOverlay.appendChild(resultBadge);
            }
            
            const resultElement = document.getElementById('tradeResult');
            const priceDiff = finalPrice - state.tradeStartPrice;
            const diffPercent = (priceDiff / state.tradeStartPrice * 100).toFixed(2);
            
            resultElement.innerHTML = `
                ${isWin ? '✅ WIN' : '❌ LOSE'} | 
                ${state.tradeDirection.toUpperCase()} | 
                ${priceDiff >= 0 ? '+' : ''}${diffPercent}%
            `;
        }

        function resetTradeState() {
            state.tradeActive = false;
            state.tradeStartTime = 0;
            state.tradeEndTime = 0;
            state.tradeStartPrice = 0;
            state.tradeEndPrice = 0;
            state.tradeDirection = null;
            state.tradeResult = null;
            
            // Rimuovi gli elementi del trade
            const countdownElement = document.getElementById('tradeCountdown');
            const resultElement = document.getElementById('tradeResult');
            if (countdownElement) countdownElement.remove();
            if (resultElement) resultElement.remove();
        }

        function updateTradeUI() {
            if (state.tradeActive) {
                // Cambia testo dei bottoni durante il trade
                dom.longBtn.textContent = state.tradeDirection === 'long' ? 'WAITING...' : 'LONG';
                dom.shortBtn.textContent = state.tradeDirection === 'short' ? 'WAITING...' : 'SHORT';
                
                // Cambia colore dei bottoni attivi
                if (state.tradeDirection === 'long') {
                    dom.longBtn.style.opacity = '0.7';
                    dom.shortBtn.style.opacity = '0.3';
                } else if (state.tradeDirection === 'short') {
                    dom.longBtn.style.opacity = '0.3';
                    dom.shortBtn.style.opacity = '0.7';
                }
            } else {
                // Ripristina stato normale
                dom.longBtn.textContent = 'LONG';
                dom.shortBtn.textContent = 'SHORT';
                dom.longBtn.style.opacity = '1';
                dom.shortBtn.style.opacity = '1';
            }
        }

        // ==================== MODIFICHE ALLE FUNZIONI ESISTENTI ====================
        function initGame() {
            setupCanvas();
            createLeverageDots();
            loadGameState();
            setupEventListeners();
            updateUI();
            updateSliderThumbs();
            updateDockActiveState();
            
            // Aggiungi badge per il prezzo Bitcoin
            const chartOverlay = document.querySelector('.chart-overlay');
            const btcPriceBadge = document.createElement('div');
            btcPriceBadge.className = 'chart-badge';
            btcPriceBadge.id = 'btcPriceBadge';
            btcPriceBadge.innerHTML = 'BTC Loading...';
            chartOverlay.appendChild(btcPriceBadge);
            
            // Inizia l'aggiornamento del prezzo Bitcoin
            updateBitcoinPrice();
            setInterval(updateBitcoinPrice, state.btcUpdateInterval);
            
            // Inizia a disegnare il grafico
            drawBtcChartLoop();
        }

        function drawBtcChartLoop() {
            if (state.currentPage === 'trading') {
                updateBtcChart();
            }
            requestAnimationFrame(drawBtcChartLoop);
        }

        // Modifica gli handler dei bottoni LONG/SHORT
        function handleLong() {
            if (!state.gameActive || state.tradeActive || state.isAnimating) return;
            startBtcTrade('long');
        }

        function handleShort() {
            if (!state.gameActive || state.tradeActive || state.isAnimating) return;
            startBtcTrade('short');
        }

        // Mantieni tutte le altre funzioni del tuo codice originale...
        // ... (le funzioni utility, UI, persistence, ecc. rimangono uguali)

        // ==================== INIZIALIZZAZIONE ====================
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
