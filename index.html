<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trade-X · Prevedi il Bitcoin</title>
<style>
:root{
  --bg:#0b0e14; --card:#141923; --line:#232b3a; --text:#e8ecf4; --mute:#7d889e;
  --up:#19d38a; --down:#ff4d6a; --accent:#f7b731;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{width:100%;max-width:480px;min-height:100%;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}

.top{display:flex;justify-content:space-between;align-items:flex-start}
.bal-label,.lbl{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.bal{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.src{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.src.live{color:var(--up);border-color:rgba(25,211,138,.4)}
.src.sim{color:var(--accent);border-color:rgba(247,183,49,.4)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.price-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.price{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.chg{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.chart-wrap{position:relative;height:210px}
canvas{width:100%;height:100%;display:block}
.round-badge{position:absolute;top:6px;left:6px;right:6px;display:none;justify-content:space-between;
  font-size:12px;font-weight:700;pointer-events:none}
.round-badge span{background:rgba(0,0,0,.6);padding:4px 9px;border-radius:99px}
.round-badge.on{display:flex}

.chips{display:flex;gap:8px;margin-top:6px}
.chip{flex:1;padding:10px 0;border-radius:10px;background:#1b2230;border:1px solid var(--line);
  font-weight:700;font-size:14px;color:var(--mute);transition:.15s}
.chip.on{background:rgba(247,183,49,.14);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.4}
.stake-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.stake-row .chip{flex:0 0 44px;padding:10px 0}
.stake-val{flex:1;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:8px}

.bet{display:flex;gap:10px;margin-top:12px}
.bet button{flex:1;padding:18px 0;border-radius:14px;font-size:18px;font-weight:800;color:#06120c;
  transition:transform .1s,opacity .2s}
.bet button:active{transform:scale(.97)}
.bet .b-up{background:var(--up)} .bet .b-down{background:var(--down);color:#190309}
.bet button:disabled{opacity:.35}
.bet small{display:block;font-size:11px;font-weight:700;opacity:.75}

.live-round{display:none;text-align:center}
.live-round.on{display:block}
.count{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin-top:6px}
.bar{height:6px;border-radius:9px;background:#1b2230;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .25s linear}
.status{font-size:15px;font-weight:800}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:210px;overflow:auto}
.h{display:flex;justify-content:space-between;font-size:13px;padding:8px 10px;border-radius:9px;background:#1b2230;
  font-variant-numeric:tabular-nums}
.h .w{color:var(--up);font-weight:800}.h .l{color:var(--down);font-weight:800}.h .t{color:var(--mute);font-weight:800}
.reset{background:none;color:var(--mute);font-size:12px;text-decoration:underline;align-self:center;margin-top:4px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.overlay.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;
  width:100%;max-width:320px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:30px;margin-bottom:6px}
.modal .amt{font-size:34px;font-weight:800;margin:8px 0}
.modal p{color:var(--mute);font-size:14px;margin-bottom:4px}
.modal .go{margin-top:18px;width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#1a1200;font-weight:800;font-size:16px}
.how{font-size:12px;color:var(--mute);line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="bal-label">Saldo (virtuale)</div>
      <div class="bal" id="bal">$1,000</div>
    </div>
    <div class="src" id="src">…</div>
  </div>

  <div class="card">
    <div class="price-row">
      <div class="price" id="price">—</div>
      <div class="chg" id="chg"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="cv"></canvas>
      <div class="round-badge" id="badge"><span id="bDir"></span><span id="bPl"></span></div>
    </div>
  </div>

  <div class="card">
    <div id="setup">
      <div class="lbl">Durata</div>
      <div class="chips" id="durs"></div>
      <div class="lbl" style="margin-top:12px">Puntata</div>
      <div class="stake-row">
        <button class="chip" id="minus">−</button>
        <div class="stake-val" id="stake">$50</div>
        <button class="chip" id="plus">+</button>
      </div>
      <div class="chips" id="quick"></div>
      <div class="bet">
        <button class="b-up" id="up">▲ SU<small id="upWin"></small></button>
        <button class="b-down" id="down">▼ GIÙ<small id="downWin"></small></button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="live-round" id="live">
      <div class="lbl" id="liveLbl"></div>
      <div class="count" id="count">0</div>
      <div class="bar"><i id="barI"></i></div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div><b id="sW">0</b><span class="lbl">Vinte</span></div>
      <div><b id="sL">0</b><span class="lbl">Perse</span></div>
      <div><b id="sS">0</b><span class="lbl">Serie</span></div>
      <div><b id="sB">0</b><span class="lbl">Record</span></div>
    </div>
    <div class="hist" id="hist"></div>
  </div>

  <div class="how">Vincita: +90% della puntata. Ogni vittoria di fila aggiunge +10% di bonus (max +50%). Parità = puntata restituita. Soldi finti, nessun rischio reale.</div>
  <button class="reset" id="reset">Azzera tutto</button>
</div>

<div class="overlay" id="ov">
  <div class="modal">
    <h2 id="mT"></h2>
    <div class="amt" id="mA"></div>
    <p id="mP1"></p><p id="mP2"></p>
    <button class="go" id="mGo">Continua</button>
  </div>
</div>

<script>
"use strict";
// ================= CONFIG =================
const DURATIONS = [5, 15, 30, 60];
const START_BALANCE = 1000;
const PAYOUT = 0.9;          // +90%
const STREAK_BONUS = 0.1;    // +10% per vittoria consecutiva
const STREAK_BONUS_MAX = 0.5;
const MAX_POINTS = 240;      // 240 campioni * 250ms = 60s di grafico
const SAMPLE_MS = 250;
const SAVE_KEY = "tradex_predict_v2";

// ================= STATO =================
const $ = id => document.getElementById(id);
let S = load();
let price = 0, openPrice = 0, lastTick = 0;
let points = [];
let round = null;        // {dir, entry, stake, end, dur, streak}
let sel = { dur: 15, stake: 50 };
let mode = "connecting"; // ws | rest | sim | connecting

function load(){
  const d = {balance:START_BALANCE, wins:0, losses:0, streak:0, best:0, hist:[]};
  try{ const r = JSON.parse(localStorage.getItem(SAVE_KEY)); if(r && typeof r.balance==="number") return Object.assign(d,r); }catch(e){}
  return d;
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

// ================= FEED PREZZO =================
let ws = null, restFails = 0;
function setPrice(p, src){
  if(!isFinite(p) || p <= 0) return;
  if(!openPrice) openPrice = p;
  price = p; lastTick = Date.now(); mode = src; restFails = 0;
}
function startWS(){
  if(ws) return;
  try{
    ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@trade");
    ws.onmessage = e => { try{ setPrice(parseFloat(JSON.parse(e.data).p), "ws"); }catch(_){} };
    ws.onclose = ws.onerror = () => { ws = null; };
  }catch(e){ ws = null; }
}
const REST = [
  ["https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT", j => parseFloat(j.price)],
  ["https://api.coinbase.com/v2/prices/BTC-USD/spot", j => parseFloat(j.data.amount)],
  ["https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd", j => j.bitcoin.usd]
];
async function pollRest(){
  for(const [url, parse] of REST){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 3000);
      const r = await fetch(url, {signal: ctl.signal}); clearTimeout(t);
      const p = parse(await r.json());
      if(p > 0){ setPrice(p, "rest"); return true; }
    }catch(e){}
  }
  restFails++; return false;
}
function simStep(){
  if(!price){ price = 60000 + Math.random()*20000; openPrice = price; }
  price *= 1 + (Math.random()-0.5) * 0.0004;
  lastTick = Date.now();
}
function feedWatchdog(){
  const stale = Date.now() - lastTick > 3000;
  if(mode === "ws" && !stale) return;
  if(mode === "sim"){ if(Math.random() < 0.1){ startWS(); pollRest(); } return; }
  startWS();
  if(stale) pollRest().then(ok => { if(!ok && restFails >= 2 && Date.now()-lastTick > 3000) mode = "sim"; });
}

// ================= LOOP =================
function sample(){
  if(mode === "sim") simStep();
  if(!price) return;
  points.push({p: price});
  if(points.length > MAX_POINTS) points.shift();
  if(round && Date.now() >= round.end) settle();
  render();
}

// ================= ROUND =================
function payoutMult(streak){ return PAYOUT * (1 + Math.min(STREAK_BONUS_MAX, streak*STREAK_BONUS)); }
function startRound(dir){
  if(round || !price || sel.stake > S.balance || sel.stake <= 0) return;
  S.balance -= sel.stake;
  const now = Date.now();
  round = {dir, entry: price, stake: sel.stake, end: now + sel.dur*1000, dur: sel.dur, streak: S.streak};
  save(); sync();
}
function settle(){
  const r = round; round = null;
  const exit = price, diff = exit - r.entry;
  let res, profit;
  if(Math.abs(diff) < 0.005){ res = "tie"; profit = 0; S.balance += r.stake; }
  else if((diff > 0) === (r.dir === "up")){
    res = "win"; profit = r.stake * payoutMult(r.streak);
    S.balance += r.stake + profit; S.wins++; S.streak++; S.best = Math.max(S.best, S.streak);
  } else { res = "loss"; profit = -r.stake; S.losses++; S.streak = 0; }
  S.hist.unshift({res, dir:r.dir, stake:r.stake, profit, dur:r.dur});
  S.hist = S.hist.slice(0, 30);
  save(); sync(); showResult(res, profit, r, exit);
}
function showResult(res, profit, r, exit){
  $("mT").textContent = res==="win" ? "🎉 Hai vinto!" : res==="loss" ? "💥 Hai perso" : "🤝 Parità";
  $("mT").className = res==="win" ? "up" : res==="loss" ? "down" : "";
  $("mA").textContent = res==="tie" ? "Puntata restituita" : (profit>0?"+":"−")+fmt(Math.abs(profit));
  $("mA").className = "amt " + (res==="win"?"up":res==="loss"?"down":"");
  $("mP1").textContent = "Ingresso " + fmtP(r.entry) + " → Uscita " + fmtP(exit);
  $("mP2").textContent = res==="win" && S.streak>1 ? "🔥 Serie: " + S.streak + " vittorie" : "Previsione: " + (r.dir==="up"?"SU ▲":"GIÙ ▼");
  $("mGo").textContent = S.balance < 1 ? "Ricomincia con $1,000" : "Continua";
  $("ov").classList.add("on");
}
$("mGo").onclick = () => {
  $("ov").classList.remove("on");
  if(S.balance < 1){ S.balance = START_BALANCE; S.streak = 0; save(); sel.stake = 50; sync(); }
};

// ================= UI =================
const fmt = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtP = n => "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const srcText = () => mode==="sim" ? "● PREZZO SIMULATO" : mode==="connecting" ? "Connessione…" : "● LIVE BTC/USD";
const step = s => s>=500 ? 100 : s>=100 ? 50 : 10;

function buildControls(){
  $("durs").innerHTML = DURATIONS.map(d => `<button class="chip" data-d="${d}">${d}s</button>`).join("");
  $("durs").onclick = e => { const d = e.target.dataset.d; if(d && !round){ sel.dur = +d; sync(); } };
  $("quick").innerHTML = [["10%",.1],["25%",.25],["50%",.5],["MAX",1]].map(([l,f]) => `<button class="chip" data-f="${f}">${l}</button>`).join("");
  $("quick").onclick = e => { const f = e.target.dataset.f; if(f && !round){ sel.stake = Math.max(1, Math.floor(S.balance*f)); sync(); } };
  $("minus").onclick = () => { if(!round){ sel.stake = Math.max(1, sel.stake - step(sel.stake-1)); sync(); } };
  $("plus").onclick  = () => { if(!round){ sel.stake = Math.min(Math.floor(S.balance), sel.stake + step(sel.stake)); sync(); } };
  $("up").onclick = () => startRound("up");
  $("down").onclick = () => startRound("down");
  $("reset").onclick = () => { if(confirm("Azzerare saldo e statistiche?")){ round=null; S={balance:START_BALANCE,wins:0,losses:0,streak:0,best:0,hist:[]}; sel.stake=50; save(); sync(); } };
}
function sync(){
  if(sel.stake > S.balance) sel.stake = Math.max(1, Math.floor(S.balance));
  $("bal").textContent = fmt(S.balance);
  $("stake").textContent = fmt(sel.stake);
  document.querySelectorAll("#durs .chip").forEach(b => { b.classList.toggle("on", +b.dataset.d === sel.dur); b.disabled = !!round; });
  const win = sel.stake * payoutMult(S.streak);
  $("upWin").textContent = $("downWin").textContent = "vinci +" + fmt(win);
  $("up").disabled = $("down").disabled = !(!round && price > 0 && S.balance >= 1);
  $("setup").style.display = round ? "none" : "block";
  $("live").classList.toggle("on", !!round);
  $("badge").classList.toggle("on", !!round);
  $("hint").textContent = S.streak > 0
    ? `🔥 Serie di ${S.streak}: bonus +${Math.round(Math.min(STREAK_BONUS_MAX,S.streak*STREAK_BONUS)*100)}% sulla vincita`
    : "Prevedi se il Bitcoin sarà più alto o più basso alla scadenza.";
  $("sW").textContent = S.wins; $("sL").textContent = S.losses; $("sS").textContent = S.streak; $("sB").textContent = S.best;
  $("hist").innerHTML = S.hist.length ? S.hist.slice(0,10).map(h =>
    `<div class="h"><span>${h.dir==="up"?"▲":"▼"} ${h.dur}s · ${fmt(h.stake)}</span><span class="${h.res==="win"?"w":h.res==="loss"?"l":"t"}">${h.res==="tie"?"=":(h.profit>0?"+":"−")+fmt(Math.abs(h.profit))}</span></div>`
  ).join("") : `<div class="hint">Nessuna partita ancora</div>`;
  const s = $("src");
  s.className = "src " + (mode==="sim" ? "sim" : mode==="connecting" ? "" : "live");
  s.textContent = srcText();
}

let lastSrc = "";
function render(){
  const t = srcText();
  if(t !== lastSrc || ($("up").disabled && !round)){ lastSrc = t; sync(); }
  $("price").textContent = fmtP(price);
  const ch = (price/openPrice - 1) * 100;
  $("chg").textContent = (ch>=0?"+":"") + ch.toFixed(3) + "%";
  $("chg").className = "chg " + (ch>=0?"up":"down");
  if(round){
    const left = Math.max(0, round.end - Date.now());
    $("count").textContent = Math.ceil(left/1000);
    $("barI").style.width = (left/(round.dur*1000)*100) + "%";
    const d = price - round.entry;
    const tie = Math.abs(d) < 0.005, winning = !tie && (d>0) === (round.dir==="up");
    $("liveLbl").textContent = `Previsione ${round.dir==="up"?"SU ▲":"GIÙ ▼"} · puntata ${fmt(round.stake)} · ingresso ${fmtP(round.entry)}`;
    $("status").textContent = tie ? "In parità…" : winning ? "✅ Stai vincendo" : "❌ Stai perdendo";
    $("status").className = "status " + (tie ? "" : winning ? "up" : "down");
    $("bDir").textContent = round.dir==="up" ? "▲ SU" : "▼ GIÙ";
    $("bDir").className = round.dir==="up" ? "up" : "down";
    $("bPl").textContent = (d>=0?"+":"") + d.toFixed(2) + " USD";
    $("bPl").className = d>=0 ? "up" : "down";
  }
  draw();
}

// ================= GRAFICO =================
const cv = $("cv"), cx = cv.getContext("2d");
function draw(){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !h) return;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,w,h);
  if(points.length < 2) return;
  let min = Infinity, max = -Infinity;
  for(const q of points){ if(q.p<min)min=q.p; if(q.p>max)max=q.p; }
  if(round){ min = Math.min(min, round.entry); max = Math.max(max, round.entry); }
  let pad = (max-min)*0.15; if(pad < price*0.00005) pad = price*0.00005;
  min -= pad; max += pad;
  const W = w - 62;
  const x0 = W - (points.length-1)/(MAX_POINTS-1)*W;
  const x = i => x0 + i/(MAX_POINTS-1)*W;
  const y = p => h - 8 - (p-min)/(max-min)*(h-16);
  cx.strokeStyle = "rgba(255,255,255,.05)"; cx.lineWidth = 1; cx.fillStyle = "#7d889e"; cx.font = "10px sans-serif";
  for(let k=0;k<=3;k++){ const v = min + (max-min)*k/3, yy = y(v); cx.beginPath(); cx.moveTo(0,yy); cx.lineTo(W,yy); cx.stroke(); cx.fillText(v.toFixed(0), W+6, yy+3); }
  const up = points[points.length-1].p >= points[0].p, col = up ? "#19d38a" : "#ff4d6a";
  cx.beginPath(); points.forEach((q,i)=> i?cx.lineTo(x(i),y(q.p)):cx.moveTo(x(i),y(q.p)));
  cx.strokeStyle = col; cx.lineWidth = 2; cx.lineJoin = "round"; cx.stroke();
  const g = cx.createLinearGradient(0,0,0,h); g.addColorStop(0, up?"rgba(25,211,138,.22)":"rgba(255,77,106,.22)"); g.addColorStop(1,"rgba(0,0,0,0)");
  cx.lineTo(x(points.length-1),h); cx.lineTo(x(0),h); cx.closePath(); cx.fillStyle = g; cx.fill();
  if(round){
    const ye = y(round.entry);
    cx.setLineDash([5,4]); cx.strokeStyle = "#f7b731"; cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(0,ye); cx.lineTo(W,ye); cx.stroke(); cx.setLineDash([]);
    cx.fillStyle = "#f7b731"; cx.fillText("INGRESSO", 6, ye-5);
  }
  const lx = x(points.length-1), ly = y(price);
  cx.beginPath(); cx.arc(lx,ly,4,0,7); cx.fillStyle = col; cx.fill();
  cx.fillRect(W+2, ly-8, 58, 16);
  cx.fillStyle = "#06120c"; cx.font = "bold 10px sans-serif"; cx.fillText(price.toFixed(0), W+6, ly+3.5);
}

// ================= AVVIO =================
buildControls(); sync();
startWS(); pollRest();
setInterval(feedWatchdog, 1500);
setInterval(sample, SAMPLE_MS);
setInterval(() => { if(mode==="rest") pollRest(); }, 1000);
setTimeout(() => { if(!price) mode = "sim"; }, 4000);
window.addEventListener("resize", draw);
</script>
</body>
</html>
