<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>XTrade - Sistema Leva Progressiva</title>
    <style>
        /* ... (tutti gli stili rimangono uguali) ... */
        
        /* Aggiungi questa regola per la scritta di sblocco */
        .unlock-info.fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>
    <!-- ... (HTML rimane lo stesso) ... -->
    
    <div class="game-over" id="gameOverScreen">
        <h2>BANCAROTTA</h2>
        <button id="restartBtn" class="restart-btn">RIPROVA</button> <!-- Cambiato da RIPRENDI a RIPROVA -->
    </div>

    <script>
        // ==================== SISTEMA LEVE ====================
        // ... (tutto uguale fino alle variabili globali) ...

        // ==================== VARIABILI GLOBALI ====================
        let balance = 100;
        let bestBalance = localStorage.getItem('tradingBestBalance') ? parseInt(localStorage.getItem('tradingBestBalance')) : 100; // MODIFICA: Carica da localStorage
        // ... (altre variabili rimangono uguali) ...

        // ==================== FUNZIONI CORE ====================
        // ... (altre funzioni rimangono uguali) ...

        function loadGameState() {
            const savedBalance = localStorage.getItem('tradingBalance');
            const savedBestBalance = localStorage.getItem('tradingBestBalance'); // MODIFICA: Carica bestBalance
            const savedPercentage = localStorage.getItem('tradingPercentage');
            const savedLeverageIndex = localStorage.getItem('tradingLeverageIndex');
            const savedTotalTrades = localStorage.getItem('tradingTotalTrades');
            
            if (savedBalance) balance = parseInt(savedBalance);
            if (savedBestBalance) bestBalance = parseInt(savedBestBalance); // MODIFICA: Non resettare a 100
            if (savedPercentage) {
                betPercentage = parseInt(savedPercentage);
                percentageSlider.value = betPercentage;
                percentageValue.textContent = `${betPercentage}%`;
            }
            if (savedLeverageIndex) {
                leverageIndex = parseInt(savedLeverageIndex);
                leverageSlider.value = leverageIndex;
                const settings = LEVERAGE_SETTINGS[leverageIndex];
                leverage = settings.leverage;
                leverageValue.textContent = `${leverage}x`;
            }
            if (savedTotalTrades) {
                totalTrades = parseInt(savedTotalTrades);
                totalTradesElement.textContent = totalTrades;
            }
            
            updateBalanceDisplay();
            updateLeverageControls();
            updateBetInfo();
            updateUnlockInfo();
            updateStats();
        }

        // MODIFICA: Aggiungi variabile per timeout
        let unlockMessageTimeout = null;

        function updateUnlockInfo() {
            const next = getNextUnlock();
            const maxUnlockedIndex = getMaxUnlockedLeverageIndex();
            
            // Cancella il timeout precedente se esiste
            if (unlockMessageTimeout) {
                clearTimeout(unlockMessageTimeout);
                unlockMessageTimeout = null;
            }
            
            if (next) {
                const winChance = Math.round(next.winChance * 100);
                unlockInfo.textContent = `Prossimo sblocco: ${next.leverage}x (${winChance}% win) a $${next.threshold} ($${next.remaining} rimanenti)`;
                unlockInfo.style.color = "#ffaa44";
                unlockInfo.classList.remove('fade-out');
            } else {
                // MODIFICA: Rimossa l'emoji 🎉
                unlockInfo.textContent = "Tutte le leve sbloccate!";
                unlockInfo.style.color = "#44ff44";
                unlockInfo.classList.remove('fade-out');
                
                // MODIFICA: Dopo 3 secondi, fa scomparire la scritta
                unlockMessageTimeout = setTimeout(() => {
                    unlockInfo.classList.add('fade-out');
                }, 3000);
            }
            
            unlockedCountElement.textContent = `${maxUnlockedIndex + 1}/${LEVERAGE_SETTINGS.length}`;
        }

        function processTradeResult() {
            const settings = getCurrentLeverageSettings();
            const bet = calculateBet();
            const win = tradeResult;
            const result = calculateTradeResult(win, bet);
            
            totalTrades++;
            totalTradesElement.textContent = totalTrades;
            
            if (!leverageStats[leverage]) {
                leverageStats[leverage] = { total: 0, wins: 0 };
            }
            leverageStats[leverage].total++;
            if (win) leverageStats[leverage].wins++;
            
            balance += result;
            
            if (win) {
                statusMessage.textContent = `VITTORIA! +$${bet * leverage} (${leverage}x)`;
                chartColor = "#0c0";
            } else {
                statusMessage.textContent = `PERDITA! -$${bet}`;
                chartColor = "#f00";
            }
            
            // MODIFICA: Aggiorna il record SOLO se il saldo attuale è maggiore
            if (balance > bestBalance) {
                bestBalance = balance;
                localStorage.setItem('tradingBestBalance', bestBalance.toString()); // Salva il record
            }
            
            drawChart();
            
            saveGameState();
            updateBalanceDisplay();
            updateLeverageControls();
            updateBetInfo();
            updateUnlockInfo();
            updateStats();
            
            if (balance <= 0) {
                gameActive = false;
                gameOverScreen.style.display = 'flex';
                // MODIFICA: Il record NON viene azzerato in caso di bancarotta
                // bestBalance rimane invariato
                return;
            }
            
            setTimeout(startNewRound, 2000);
        }

        function restartGame() {
            // MODIFICA: Resetta solo il saldo corrente, NON il record
            balance = 100;
            gameActive = true;
            leverageIndex = 0;
            leverage = 1;
            betPercentage = 10;
            totalTrades = 0;
            tradeResult = null;
            
            percentageSlider.value = betPercentage;
            percentageValue.textContent = `${betPercentage}%`;
            leverageSlider.value = leverageIndex;
            leverageValue.textContent = `${leverage}x`;
            
            gameOverScreen.style.display = 'none';
            
            updateBalanceDisplay();
            updateLeverageControls();
            updateBetInfo();
            updateUnlockInfo();
            updateStats();
            saveGameState();
            startNewRound();
        }

        // ... (il resto del codice rimane uguale) ...
    </script>
</body>
</html>
